<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конструктор тренировок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
/* Палитра бренда: фиолетовый #472549, оранжевый #F0820B, лавандовый #B49CDB, золотой #B9A00F.
   Макет: фиолетовая шапка, светлая бумага, карточки с мягкой тенью. TRX оранжевый, гантели золотые, резинки лавандовые. */
:root {
  --bg: #F8F5FA; --card: #FFFFFF; --text: #2A1630; --muted: #75637A; --line: #ECE4EF;
  --primary: #472549; --primary-2: #5E3562; --on-primary: #FFFFFF;
  --accent: #F0820B; --on-accent: #2A1230; --lav: #B49CDB; --gold: #B9A00F;
  --tint: #F1EAF7; --ok: #2F7D4F; --warn: #A9480E; --focus: #F0820B;
  --shadow: 0 1px 2px rgba(71,37,73,.06), 0 12px 32px -12px rgba(71,37,73,.18);
  --font-display: 'Unbounded', 'Onest', system-ui, sans-serif;
  --font-body: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #150B17; --card: #21122A; --text: #F4ECF6; --muted: #BDA9C1; --line: #37243E;
    --primary: #B49CDB; --primary-2: #C9B6E8; --on-primary: #1E0F22; --tint: #2E1C37;
    --ok: #6FCB93; --warn: #F0A06A; --shadow: 0 12px 32px -12px rgba(0,0,0,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #150B17; --card: #21122A; --text: #F4ECF6; --muted: #BDA9C1; --line: #37243E;
  --primary: #B49CDB; --primary-2: #C9B6E8; --on-primary: #1E0F22; --tint: #2E1C37;
  --ok: #6FCB93; --warn: #F0A06A; --shadow: 0 12px 32px -12px rgba(0,0,0,.6); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body { padding-bottom: 96px; }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }

/* шапка */
.hero { position: relative; overflow: hidden; background: radial-gradient(120% 140% at 85% -10%, #7A4A7E 0%, #472549 48%, #2E1531 100%); color: #fff; padding: 28px 0 56px; border-radius: 0 0 32px 32px; }
.hero .wrap { position: relative; z-index: 1; }
.hero svg.straps { position: absolute; right: -34px; top: -8px; width: 150px; height: 150px; opacity: .4; z-index: 0; }
.mark { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--lav); font-weight: 600; margin: 0 0 14px; }
.brand { font-family: var(--font-display); font-weight: 600; font-size: 26px; line-height: 1.15; letter-spacing: -0.02em; margin: 0; max-width: 11em; text-wrap: balance; }
.sub { color: #D9CBEA; font-size: 14px; margin: 10px 0 0; max-width: 17em; }
.legend { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }

/* навигация */
nav.tabs { position: sticky; top: 10px; z-index: 5; margin: -26px 0 0; padding: 5px; display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow); max-width: 720px; }
nav.tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); font: 600 14px var(--font-body); padding: 11px 8px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { background: var(--primary); color: var(--on-primary); }
.tabs-wrap { padding: 0 16px; position: sticky; top: 0; z-index: 5; max-width: 720px; margin: 0 auto; }

button, input, select, textarea { font-family: inherit; font-size: 16px; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* карточки и форма */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px 20px; margin-top: 18px; box-shadow: var(--shadow); }
.card h2 { font-family: var(--font-display); font-size: 15px; font-weight: 600; margin: 0 0 16px; letter-spacing: -0.01em; }
.field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
.field > label, .field > .lbl { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
input[type=text], input[type=url], select, textarea { width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); }
textarea { min-height: 120px; resize: vertical; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg button, .chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 9px 16px; cursor: pointer; font-size: 14px; font-weight: 500; }
.seg button[aria-pressed="true"], .chip[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.hint { font-size: 14px; color: var(--muted); margin: 0; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 11px 18px; cursor: pointer; font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-size: 16px; padding: 17px 20px; width: 100%; box-shadow: 0 10px 24px -10px rgba(240,130,11,.7); }
.btn.dark { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.danger { color: var(--warn); border-color: var(--warn); }
.btn.armed { background: var(--warn); color: #fff; border-color: var(--warn); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.between { justify-content: space-between; }

/* бейджи оборудования */
.eq { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; letter-spacing: .02em; padding: 4px 10px 4px 8px; border-radius: 999px; line-height: 1.2; }
.eq svg { width: 14px; height: 14px; flex: none; }
.eq.t { background: var(--accent); color: #2A1230; }
.eq.d { background: var(--gold); color: #1F1A00; }
.eq.r { background: var(--lav); color: #2A1740; }
.eq.b { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 600; }
.hero .eq.b { color: #D9CBEA; border-color: rgba(255,255,255,.25); }

/* программа */
.sum { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 14px; }
.sum .lbl { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin-right: 2px; }
.sess { padding: 0; overflow: hidden; }
.sess-h { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%); color: var(--on-primary); padding: 18px 20px; display: flex; align-items: baseline; gap: 12px; }
.sess-h b { font-family: var(--font-display); font-size: 20px; font-weight: 600; }
.sess-h span { font-size: 14px; opacity: .85; }
.sess-b { padding: 6px 20px 18px; }
.blk { margin-top: 16px; }
.blk h4 { display: flex; align-items: center; gap: 8px; margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.blk h4::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.blk.warm h4::before, .blk.cool h4::before, .blk.pf h4::before { background: var(--lav); }
.ex { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: start; padding: 14px 0; border-top: 1px solid var(--line); }
.blk h4 + .ex { border-top: 0; }
.ex-n { font-family: var(--font-display); font-size: 13px; font-weight: 600; color: var(--lav); padding-top: 2px; }
.ex.trx .ex-n { color: var(--accent); }
.ex-name { font-weight: 600; line-height: 1.3; text-wrap: pretty; }
.ex-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
.ex-rx { margin-top: 8px; font-size: 15px; font-weight: 600; color: var(--primary); font-variant-numeric: tabular-nums; }
.ex-rx small { font-weight: 500; color: var(--muted); font-size: 13px; }
.ex-note { font-size: 13px; color: var(--muted); margin-top: 4px; }
.ex-act { display: flex; gap: 6px; }
.ic { border: 1px solid var(--line); background: var(--bg); border-radius: 50%; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); text-decoration: none; padding: 0; }
.ic svg { width: 18px; height: 18px; }
.ic.vid { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
.warn { background: var(--tint); border-left: 4px solid var(--warn); padding: 12px 14px; border-radius: 12px; font-size: 14px; margin-top: 14px; }
.prog { padding-left: 0; margin: 0; list-style: none; display: grid; gap: 10px; }
.prog li { font-size: 14px; padding-left: 14px; border-left: 3px solid var(--lav); }

/* списки */
.list-row { display: flex; gap: 12px; justify-content: space-between; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); cursor: pointer; }
.list-row:first-of-type { border-top: 0; }
.list-row .t { font-weight: 600; line-height: 1.3; }
.meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
.pill { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--tint); margin: 6px 6px 0 0; }
.pill.ok { color: var(--ok); }
.pill.none { color: var(--muted); }
.stats { display: flex; gap: 22px; flex-wrap: wrap; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.stats b { display: block; font-family: var(--font-display); font-size: 26px; color: var(--primary); font-weight: 600; }
.modal-bg { position: fixed; inset: 0; background: rgba(30,12,34,.62); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.modal { background: var(--card); width: 100%; max-width: 640px; max-height: 92%; overflow: auto; border-radius: 26px 26px 0 0; padding: 22px 20px 28px; }
@media (min-width: 700px) { .modal-bg { align-items: center; } .modal { border-radius: 26px; } }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.checks label { display: flex; gap: 6px; align-items: center; font-size: 14px; border: 1px solid var(--line); padding: 9px 12px; border-radius: 12px; text-transform: none; letter-spacing: 0; color: var(--text); font-weight: 500; }
.checks input { width: 18px; height: 18px; }
.empty { color: var(--muted); padding: 22px 0; text-align: center; }
@media (prefers-reduced-motion: no-preference) { .btn, .chip, .seg button, nav.tabs button { transition: background .15s, color .15s; } }
@media (min-width: 640px) { .brand { font-size: 32px; } .sub { max-width: 28em; } .hero svg.straps { width: 240px; height: 240px; right: 20px; opacity: .55; } }

/* языки и стили блоков */
.langs{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.14);margin:0 0 14px;position:relative;z-index:2}
.langs button{border:0;background:transparent;color:inherit;font:600 12px/1 inherit;letter-spacing:.04em;padding:8px 11px;border-radius:999px;cursor:pointer;min-height:32px}
.langs button[aria-pressed="true"]{background:var(--accent);color:#fff}
.langs button:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
.blk h4 .rnd{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;background:var(--lav);color:var(--primary);font:600 11px/1.5 inherit;letter-spacing:.02em;vertical-align:middle;text-transform:none}
.stl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 10px;padding:8px 10px;border-radius:12px;background:rgba(180,156,219,.16)}
.stl-n{font-weight:700;font-size:13px;color:var(--primary)}
.stl-d{flex:1;min-width:140px;font-size:12.5px;opacity:.8}
.stl .ic{width:32px;height:32px}

.ex-pro{font-size:12px;letter-spacing:.02em;opacity:.6;margin:1px 0 4px;font-style:italic}
.ex-how{font-size:13.5px;line-height:1.45;opacity:.82;margin-top:6px}

</style>
</head>

var DESC_I18N = [["Bodyweight squat", "Ноги на ширине плеч, таз назад и вниз, колени смотрят по носкам, спина прямая. Встаньте, выталкивая пол.", "Ноги на ширині плечей, таз назад і вниз, коліна дивляться за носками, спина пряма. Підніміться, відштовхуючись від підлоги.", "Pieds à largeur d'épaules, bassin en arrière et vers le bas, genoux dans l'axe des pieds, dos droit. Remontez en poussant le sol.", "Feet shoulder-width, hips back and down, knees over toes, back straight. Stand up by pushing the floor away."], ["Paused squat", "Присед с остановкой на 2 секунды в нижней точке без расслабления, затем уверенный подъем.", "Присід із зупинкою на 2 секунди внизу без розслаблення, потім упевнений підйом.", "Squat avec arrêt de 2 secondes en bas sans relâcher, puis remontée franche.", "Squat with a 2-second hold at the bottom without relaxing, then drive up."], ["Narrow-stance squat", "Стопы вместе или на ширине таза. Колени идут вперед над носками, нагрузка смещается на переднюю поверхность бедра.", "Стопи разом або на ширині таза. Коліна йдуть уперед над носками, навантаження зміщується на передню поверхню стегна.", "Pieds joints ou à largeur de bassin. Les genoux avancent au-dessus des orteils, la charge passe sur l'avant de la cuisse.", "Feet together or hip-width. Knees travel forward over the toes, shifting the load to the front of the thigh."], ["Wall sit", "Спина прижата к стене, бедра параллельно полу, колени под углом 90 градусов. Держите позу.", "Спина притиснута до стіни, стегна паралельно підлозі, коліна під кутом 90 градусів. Утримуйте позу.", "Dos plaqué au mur, cuisses parallèles au sol, genoux à 90 degrés. Tenez la position.", "Back against the wall, thighs parallel to the floor, knees at 90 degrees. Hold the position."], ["TRX assisted squat", "Держитесь за ручки TRX, отведите таз назад и вниз. Руки только помогают, основную работу делают ноги.", "Тримайтеся за ручки TRX, відведіть таз назад і вниз. Руки лише допомагають, основну роботу виконують ноги.", "Tenez les poignées TRX, bassin en arrière et vers le bas. Les bras aident seulement, ce sont les jambes qui travaillent.", "Hold the TRX handles and sit hips back and down. Arms only assist, the legs do the work."], ["TRX assisted sumo squat", "Ноги шире плеч, носки врозь. Приседайте строго вниз, колени идут по линии носков, TRX помогает держать баланс.", "Ноги ширше плечей, носки врізнобіч. Присідайте суворо вниз, коліна йдуть по лінії носків, TRX допомагає тримати баланс.", "Jambes plus larges que les épaules, pointes vers l'extérieur. Descendez à la verticale, genoux dans l'axe des pieds, le TRX aide l'équilibre.", "Feet wider than shoulders, toes out. Sit straight down with knees tracking the toes; the TRX helps balance."], ["TRX pistol squat (assisted)", "Присед на одной ноге с опорой на TRX. Вторая нога впереди, тянитесь тазом назад, поднимайтесь усилием рабочей ноги.", "Присід на одній нозі з опорою на TRX. Друга нога попереду, тягніться тазом назад, піднімайтеся зусиллям робочої ноги.", "Squat sur une jambe avec appui TRX. L'autre jambe devant, bassin en arrière, remontez avec la jambe de travail.", "Single-leg squat using the TRX for support. Free leg forward, hips back, stand up with the working leg."], ["Rear-foot-elevated split squat (Bulgarian)", "Задняя нога в петле TRX. Опускайтесь вертикально вниз, переднее колено над стопой, вес на передней ноге.", "Задня нога в петлі TRX. Опускайтеся вертикально вниз, переднє коліно над стопою, вага на передній нозі.", "Pied arrière dans la sangle TRX. Descendez à la verticale, genou avant au-dessus du pied, poids sur la jambe avant.", "Back foot in the TRX strap. Lower straight down, front knee over the foot, weight on the front leg."], ["Goblet squat", "Гантель держите у груди двумя руками, локти вниз. Приседайте глубоко, грудь вверх.", "Гантель тримайте біля грудей двома руками, лікті вниз. Присідайте глибоко, груди вгору.", "Haltère contre la poitrine à deux mains, coudes vers le bas. Descendez profondément, poitrine haute.", "Hold the dumbbell at your chest with both hands, elbows down. Squat deep, chest up."], ["Tempo goblet squat", "Кубковый присед: опускание на 3 секунды, быстрый подъем. Темп делает упражнение тяжелее без добавления веса.", "Кубковий присід: опускання на 3 секунди, швидкий підйом. Темп робить вправу важчою без додавання ваги.", "Goblet squat : descente en 3 secondes, remontée rapide. Le tempo rend l'exercice plus dur sans charge supplémentaire.", "Goblet squat: lower for 3 seconds, rise fast. The tempo makes it harder without adding weight."], ["Dumbbell front squat", "Гантели лежат на плечах у шеи, локти вперед. Присед со стабильным корпусом.", "Гантелі лежать на плечах біля шиї, лікті вперед. Присід зі стабільним корпусом.", "Haltères posés sur les épaules près du cou, coudes en avant. Squat avec le buste stable.", "Dumbbells rest on the shoulders by the neck, elbows forward. Squat with a stable torso."], ["Dumbbell sumo squat", "Широкая стойка, носки врозь, гантель держите между ног двумя руками. Акцент на внутреннюю поверхность бедра и ягодицы.", "Широка стійка, носки врізнобіч, гантель тримайте між ніг двома руками. Акцент на внутрішню поверхню стегна та сідниці.", "Appui large, pointes vers l'extérieur, haltère tenu entre les jambes à deux mains. Travail des adducteurs et des fessiers.", "Wide stance, toes out, dumbbell held between the legs with both hands. Targets inner thighs and glutes."], ["Banded squat", "Резинка над коленями. Приседая, не давайте коленям заваливаться внутрь: слегка раздвигайте их наружу.", "Гумка над колінами. Присідаючи, не давайте колінам западати всередину: злегка розводьте їх назовні.", "Bande au-dessus des genoux. En descendant, ne laissez pas les genoux rentrer : poussez-les légèrement vers l'extérieur.", "Band above the knees. As you squat, keep the knees from caving in: press them gently outward."], ["Banded sumo squat", "Широкая стойка с резинкой над коленями. Колени давят на резинку наружу, ягодицы включаются сильнее.", "Широка стійка з гумкою над колінами. Коліна тиснуть на гумку назовні, сідниці вмикаються сильніше.", "Appui large avec bande au-dessus des genoux. Les genoux poussent la bande vers l'extérieur, les fessiers travaillent plus.", "Wide stance with a band above the knees. Knees push out into the band so the glutes work harder."], ["Stationary reverse lunge", "Шаг назад, оба колена сгибаются до 90 градусов, корпус прямой. Вернитесь в стойку усилием передней ноги.", "Крок назад, обидва коліна згинаються до 90 градусів, корпус прямий. Поверніться в стійку зусиллям передньої ноги.", "Pas en arrière, les deux genoux fléchis à 90 degrés, buste droit. Revenez en poussant avec la jambe avant.", "Step back, both knees bend to 90 degrees, torso upright. Return by pushing through the front leg."], ["Stationary forward lunge", "Шаг вперед, колено над стопой, корпус прямой. Оттолкнитесь и вернитесь в исходное положение.", "Крок уперед, коліно над стопою, корпус прямий. Відштовхніться й поверніться у вихідне положення.", "Pas en avant, genou au-dessus du pied, buste droit. Repoussez pour revenir au départ.", "Step forward, knee over the foot, torso upright. Push back to the start."], ["Lateral lunge", "Широкий шаг в сторону, садитесь на одну ногу, вторая остается прямой. Таз уходит назад.", "Широкий крок убік, сідайте на одну ногу, друга залишається прямою. Таз іде назад.", "Grand pas sur le côté, asseyez-vous sur une jambe, l'autre reste tendue. Le bassin part en arrière.", "Take a wide step sideways, sit onto one leg while the other stays straight. Hips move back."], ["Curtsy lunge", "Нога отходит назад по диагонали за опорную, как в реверансе. Бедра смотрят вперед, колено не заваливается внутрь.", "Нога відходить назад по діагоналі за опорну, як у реверансі. Стегна дивляться вперед, коліно не западає всередину.", "La jambe part en arrière en diagonale derrière l'appui, comme une révérence. Bassin face à l'avant, genou stable.", "Step the leg diagonally behind the standing leg, like a curtsy. Hips face forward, knee stays stable."], ["Split squat", "Ноги в шаге друг от друга, стопы не двигаются. Опускайтесь вниз и вверх по вертикали.", "Ноги в кроці одна від одної, стопи не рухаються. Опускайтеся вниз і вгору по вертикалі.", "Jambes en fente, pieds immobiles. Descendez et remontez à la verticale.", "Legs in a staggered stance, feet stay fixed. Move straight down and up."], ["Step-up", "Поставьте ногу на ступеньку целиком, встаньте усилием этой ноги, не отталкиваясь нижней. Спускайтесь медленно.", "Поставте ногу на сходинку повністю, встаньте зусиллям цієї ноги, не відштовхуючись нижньою. Спускайтеся повільно.", "Posez tout le pied sur la marche, montez avec cette jambe sans pousser avec l'autre. Redescendez lentement.", "Place the whole foot on the step, stand up with that leg without pushing off the lower one. Lower slowly."], ["Dumbbell reverse lunge", "Гантели в руках вдоль корпуса. Шаг назад с опусканием колена к полу, корпус прямой.", "Гантелі в руках уздовж корпуса. Крок назад з опусканням коліна до підлоги, корпус прямий.", "Haltères le long du corps. Pas en arrière, genou vers le sol, buste droit.", "Dumbbells at your sides. Step back and lower the knee toward the floor, torso upright."], ["Dumbbell walking lunge", "Шагайте вперед выпадами, одна нога за другой, с гантелями. Шаг достаточно длинный, корпус прямой.", "Крокуйте вперед випадами, одна нога за іншою, з гантелями. Крок достатньо довгий, корпус прямий.", "Avancez en fentes, une jambe après l'autre, avec des haltères. Pas assez long, buste droit.", "Walk forward in lunges with dumbbells, one leg after the other. Long enough step, torso upright."], ["Dumbbell goblet lateral lunge", "Гантель у руках у груди, широкий шаг в сторону и посадка на одну ногу.", "Гантель у руках біля грудей, широкий крок убік і посадка на одну ногу.", "Haltère contre la poitrine, grand pas latéral et assise sur une jambe.", "Hold the dumbbell at the chest, step wide to the side and sit onto one leg."], ["TRX assisted split squat", "Держитесь за ручки TRX для баланса. Опускайтесь в выпад вертикально, нагрузка на переднюю ногу.", "Тримайтеся за ручки TRX для балансу. Опускайтеся у випад вертикально, навантаження на передню ногу.", "Tenez les poignées TRX pour l'équilibre. Descendez à la verticale, charge sur la jambe avant.", "Hold the TRX handles for balance. Lower straight down, load stays on the front leg."], ["TRX reverse lunge (foot suspended)", "Задняя нога в петле TRX скользит назад. Опускайтесь в выпад, затем вернитесь усилием передней ноги.", "Задня нога в петлі TRX ковзає назад. Опускайтеся у випад, потім поверніться зусиллям передньої ноги.", "Le pied arrière dans la sangle glisse en arrière. Descendez en fente, puis revenez avec la jambe avant.", "Back foot in the TRX strap slides behind you. Lower into a lunge, then return with the front leg."], ["TRX assisted lateral lunge", "Держитесь за TRX, шаг в сторону, посадка на одну ногу. Корпус слегка наклонен, спина прямая.", "Тримайтеся за TRX, крок убік, посадка на одну ногу. Корпус злегка нахилений, спина пряма.", "Tenez le TRX, pas sur le côté, assise sur une jambe. Buste légèrement penché, dos droit.", "Hold the TRX, step to the side and sit onto one leg. Torso slightly tilted, back straight."], ["Banded reverse lunge", "Резинка над коленями. Шаг назад в выпад, переднее колено не уходит внутрь.", "Гумка над колінами. Крок назад у випад, переднє коліно не йде всередину.", "Bande au-dessus des genoux. Pas en arrière en fente, le genou avant ne rentre pas.", "Band above the knees. Step back into a lunge; the front knee does not collapse inward."], ["Bodyweight hip hinge", "Таз уходит назад, колени чуть согнуты, спина прямая, корпус наклоняется вперед. Движение идет из тазобедренного сустава.", "Таз іде назад, коліна трохи зігнуті, спина пряма, корпус нахиляється вперед. Рух іде з тазостегнового суглоба.", "Le bassin recule, genoux légèrement fléchis, dos droit, buste penché. Le mouvement vient de la hanche.", "Hips move back, knees slightly bent, back straight, torso tips forward. The movement comes from the hip joint."], ["Single-leg Romanian deadlift (supported)", "Стоя на одной ноге, тянитесь тазом назад, свободная нога уходит назад. Рука на опоре помогает равновесию.", "Стоячи на одній нозі, тягніться тазом назад, вільна нога йде назад. Рука на опорі допомагає рівновазі.", "Sur une jambe, bassin en arrière, l'autre jambe part derrière. La main sur un appui aide l'équilibre.", "Standing on one leg, push hips back as the free leg lifts behind. A hand on a support helps balance."], ["Heel slide bridge", "Лежа, таз приподнят в мостике. Скользите пятками вперед и назад, не опуская таз.", "Лежачи, таз піднятий у містку. Ковзайте п'ятами вперед і назад, не опускаючи таз.", "Allongée, bassin relevé en pont. Faites glisser les talons en avant et en arrière sans baisser le bassin.", "Lying down with hips lifted in a bridge. Slide the heels out and back without dropping the hips."], ["Dumbbell Romanian deadlift", "Гантели скользят вдоль бедер и голеней, таз назад, спина прямая. Подъем за счет ягодиц.", "Гантелі ковзають уздовж стегон і гомілок, таз назад, спина пряма. Підйом за рахунок сідниць.", "Haltères le long des cuisses et des tibias, bassin en arrière, dos droit. Remontez avec les fessiers.", "Dumbbells slide along thighs and shins, hips back, back straight. Stand up using the glutes."], ["Single-leg Romanian deadlift (dumbbell)", "Гантель в руке, стойка на одной ноге, корпус и свободная нога опускаются как одна линия.", "Гантель у руці, стійка на одній нозі, корпус і вільна нога опускаються як одна лінія.", "Haltère en main, appui sur une jambe, buste et jambe libre descendent en une seule ligne.", "Dumbbell in hand, stand on one leg, torso and free leg lower as one line."], ["Dumbbell sumo deadlift", "Широкая стойка, гантель между ног. Поднимайтесь за счет ягодиц и бедер, спина прямая.", "Широка стійка, гантель між ніг. Піднімайтеся за рахунок сідниць і стегон, спина пряма.", "Appui large, haltère entre les jambes. Remontez avec les fessiers et les cuisses, dos droit.", "Wide stance, dumbbell between the legs. Stand up using glutes and thighs, back straight."], ["Banded Romanian deadlift", "Встаньте на резинку, концы в руках. Наклон с отведением таза назад, подъем с напряжением ягодиц.", "Станьте на гумку, кінці в руках. Нахил із відведенням таза назад, підйом із напругою сідниць.", "Pieds sur la bande, extrémités en mains. Penchez-vous bassin en arrière, remontez en serrant les fessiers.", "Stand on the band, ends in hands. Hinge hips back, rise squeezing the glutes."], ["Banded good morning", "Резинка на плечах и под стопами. Наклон корпуса с прямой спиной, таз назад, затем выпрямление.", "Гумка на плечах і під стопами. Нахил корпуса з прямою спиною, таз назад, потім випрямлення.", "Bande sur les épaules et sous les pieds. Penchez le buste dos droit, bassin en arrière, puis redressez.", "Band over the shoulders and under the feet. Hinge forward with a straight back, hips back, then stand tall."], ["TRX assisted hip hinge", "Держитесь за TRX, откиньтесь назад, наклоняйтесь тазом назад. TRX дает опору, ягодицы и бицепс бедра работают.", "Тримайтеся за TRX, відхиліться назад, нахиляйтеся тазом назад. TRX дає опору, сідниці та біцепс стегна працюють.", "Tenez le TRX, penchez-vous en arrière, bassin en arrière. Le TRX soutient, fessiers et ischios travaillent.", "Hold the TRX, lean back and push hips back. The TRX supports you while glutes and hamstrings work."], ["TRX single-leg hip hinge", "Одна нога на полу, вторая отходит назад. Держитесь за TRX для баланса, спина прямая.", "Одна нога на підлозі, друга відходить назад. Тримайтеся за TRX для балансу, спина пряма.", "Un pied au sol, l'autre part en arrière. Tenez le TRX pour l'équilibre, dos droit.", "One foot on the floor, the other reaches back. Hold the TRX for balance, back straight."], ["TRX hamstring curl", "Лежа на спине, пятки в петлях, таз приподнят. Подтягивайте пятки к ягодицам и возвращайте.", "Лежачи на спині, п'яти в петлях, таз піднятий. Підтягуйте п'яти до сідниць і повертайте.", "Sur le dos, talons dans les sangles, bassin relevé. Ramenez les talons vers les fessiers puis revenez.", "On your back, heels in the straps, hips lifted. Pull the heels toward the glutes and return."], ["Glute bridge", "Лежа на спине, колени согнуты. Поднимите таз до прямой линии плечи-колени, сожмите ягодицы.", "Лежачи на спині, коліна зігнуті. Підніміть таз до прямої лінії плечі-коліна, стисніть сідниці.", "Sur le dos, genoux fléchis. Montez le bassin jusqu'à la ligne épaules-genoux, serrez les fessiers.", "On your back, knees bent. Lift hips until shoulders, hips and knees form a line, squeeze the glutes."], ["Glute bridge with hold", "Мостик с паузой 2 секунды наверху и сильным сжатием ягодиц.", "Місток із паузою 2 секунди нагорі та сильним стисканням сідниць.", "Pont avec pause de 2 secondes en haut et forte contraction des fessiers.", "Bridge with a 2-second pause at the top and a hard glute squeeze."], ["Single-leg glute bridge", "Одна нога стоит на полу, вторая вытянута. Поднимайте таз, не заваливая его в сторону.", "Одна нога стоїть на підлозі, друга витягнута. Піднімайте таз, не завалюючи його вбік.", "Un pied au sol, l'autre jambe tendue. Montez le bassin sans le faire pencher sur le côté.", "One foot on the floor, the other leg extended. Lift the hips without tilting them sideways."], ["Donkey kick", "На четвереньках. Согнутую ногу отводите вверх, пятка к потолку, поясница не прогибается.", "На четвереньках. Зігнуту ногу відводьте вгору, п'ята до стелі, поперек не прогинається.", "À quatre pattes. Montez la jambe fléchie, talon vers le plafond, sans cambrer le bas du dos.", "On all fours. Lift the bent leg up, heel to the ceiling, without arching the lower back."], ["Fire hydrant", "На четвереньках. Согнутую ногу поднимайте в сторону, как собака у гидранта, таз остается ровным.", "На четвереньках. Зігнуту ногу піднімайте вбік, як собака біля гідранта, таз залишається рівним.", "À quatre pattes. Levez la jambe fléchie sur le côté, bassin stable.", "On all fours. Lift the bent leg out to the side, keeping the pelvis level."], ["Side-lying leg raise", "Лежа на боку, верхняя нога прямая. Поднимайте ее вверх без раскачки, носок смотрит вперед.", "Лежачи на боці, верхня нога пряма. Піднімайте її вгору без розгойдування, носок дивиться вперед.", "Allongée sur le côté, jambe du dessus tendue. Levez-la sans élan, orteils vers l'avant.", "Lying on your side, top leg straight. Raise it without swinging, toes pointing forward."], ["Clamshell", "Лежа на боку, колени согнуты. Раскрывайте верхнее колено, как ракушку, стопы остаются вместе.", "Лежачи на боці, коліна зігнуті. Розкривайте верхнє коліно, як мушлю, стопи залишаються разом.", "Sur le côté, genoux fléchis. Ouvrez le genou du dessus comme une coquille, pieds joints.", "On your side, knees bent. Open the top knee like a shell while the feet stay together."], ["Banded glute bridge", "Резинка над коленями. Мостик с давлением коленями наружу на резинку.", "Гумка над колінами. Місток із тиском колінами назовні на гумку.", "Bande au-dessus des genoux. Pont en poussant les genoux vers l'extérieur.", "Band above the knees. Bridge while pressing the knees outward into the band."], ["Banded single-leg glute bridge", "Мостик на одной ноге с резинкой над коленями. Таз остается ровным.", "Місток на одній нозі з гумкою над колінами. Таз залишається рівним.", "Pont sur une jambe avec bande au-dessus des genoux. Bassin stable.", "Single-leg bridge with a band above the knees. Keep the pelvis level."], ["Banded donkey kick", "Резинка вокруг стоп или над коленями. Отводите согнутую ногу назад-вверх, преодолевая сопротивление.", "Гумка навколо стоп або над колінами. Відводьте зігнуту ногу назад-вгору, долаючи опір.", "Bande autour des pieds ou au-dessus des genoux. Montez la jambe fléchie en arrière contre la résistance.", "Band around the feet or above the knees. Kick the bent leg back and up against the resistance."], ["Banded fire hydrant", "Резинка над коленями. Поднимайте колено в сторону, преодолевая натяжение.", "Гумка над колінами. Піднімайте коліно вбік, долаючи натяг.", "Bande au-dessus des genoux. Levez le genou sur le côté contre la tension.", "Band above the knees. Lift the knee to the side against the tension."], ["Banded side-lying leg raise", "Резинка над коленями или на лодыжках, лежа на боку. Поднимайте верхнюю ногу плавно, без рывков.", "Гумка над колінами або на щиколотках, лежачи на боці. Піднімайте верхню ногу плавно, без ривків.", "Bande au-dessus des genoux ou aux chevilles, sur le côté. Levez la jambe du dessus sans à-coups.", "Band above the knees or at the ankles, lying on your side. Raise the top leg smoothly without jerking."], ["Banded clamshell", "Резинка над коленями. Раскрывайте колено, не отрывая стопы друг от друга, таз не переворачивается.", "Гумка над колінами. Розкривайте коліно, не відриваючи стопи одна від одної, таз не перевертається.", "Bande au-dessus des genoux. Ouvrez le genou, pieds collés, sans rouler le bassin.", "Band above the knees. Open the knee with feet touching, without rolling the pelvis back."], ["Lateral band walk", "Резинка над коленями, легкий присед. Шагайте в сторону мелкими шагами, не сводя колени.", "Гумка над колінами, легкий присід. Крокуйте вбік дрібними кроками, не зводячи коліна.", "Bande au-dessus des genoux, léger squat. Pas latéraux courts sans rapprocher les genoux.", "Band above the knees, slight squat. Take small side steps without letting the knees come together."], ["Monster walk", "Резинка над коленями или на лодыжках, стойка в полуприседе. Шагайте вперед по диагонали, стопы шире таза.", "Гумка над колінами або на щиколотках, стійка в напівприсіді. Крокуйте вперед по діагоналі, стопи ширше таза.", "Bande au-dessus des genoux ou aux chevilles, demi-squat. Avancez en diagonale, pieds plus larges que le bassin.", "Band above the knees or at the ankles, half squat. Step forward on a diagonal, feet wider than hips."], ["Banded standing kickback", "Резинка на стопах. Отводите прямую ногу назад, корпус не заваливается вперед.", "Гумка на стопах. Відводьте пряму ногу назад, корпус не завалюється вперед.", "Bande aux pieds. Envoyez la jambe tendue en arrière sans pencher le buste.", "Band around the feet. Kick the straight leg back without leaning the torso forward."], ["Weighted glute bridge", "Гантель лежит на тазу, придерживайте руками. Мостик с паузой наверху.", "Гантель лежить на тазу, притримуйте руками. Місток із паузою нагорі.", "Haltère posé sur le bassin, tenu à deux mains. Pont avec pause en haut.", "Dumbbell on the hips, hold it with both hands. Bridge with a pause at the top."], ["TRX glute bridge (feet suspended)", "Стопы в петлях TRX, лежа на спине. Поднимайте таз, стабилизируя положение стоп.", "Стопи в петлях TRX, лежачи на спині. Піднімайте таз, стабілізуючи положення стоп.", "Pieds dans les sangles TRX, sur le dos. Montez le bassin en stabilisant les pieds.", "Feet in the TRX straps, lying on your back. Lift the hips while keeping the feet steady."], ["TRX single-leg glute bridge", "Одна нога в петле, вторая поднята вверх. Поднимайте таз усилием опорной ноги.", "Одна нога в петлі, друга піднята вгору. Піднімайте таз зусиллям опорної ноги.", "Un pied dans la sangle, l'autre jambe en l'air. Montez le bassin avec la jambe d'appui.", "One foot in the strap, the other leg raised. Lift the hips using the working leg."], ["TRX standing kickback", "Держитесь за ручки, одна нога стоит, вторую отводите назад. Корпус ровный.", "Тримайтеся за ручки, одна нога стоїть, другу відводьте назад. Корпус рівний.", "Tenez les poignées, une jambe au sol, l'autre part en arrière. Buste droit.", "Hold the handles, one leg stands, the other kicks back. Torso stays upright."], ["TRX standing abduction", "Держитесь за TRX, одна нога стоит, вторую поднимайте в сторону без наклона корпуса.", "Тримайтеся за TRX, одна нога стоїть, другу піднімайте вбік без нахилу корпуса.", "Tenez le TRX, un pied au sol, levez l'autre sur le côté sans pencher le buste.", "Hold the TRX, one leg stands, the other lifts to the side without leaning the torso."], ["Wall push-up", "Руки на стене на ширине плеч, тело одной линией. Сгибайте локти, грудь тянется к стене.", "Руки на стіні на ширині плечей, тіло однією лінією. Згинайте лікті, груди тягнуться до стіни.", "Mains au mur à largeur d'épaules, corps en ligne. Fléchissez les coudes, poitrine vers le mur.", "Hands on the wall shoulder-width, body in one line. Bend the elbows and bring the chest to the wall."], ["Incline push-up", "Руки на опоре (скамья, подоконник). Корпус прямой, грудь опускается к опоре.", "Руки на опорі (лавка, підвіконня). Корпус прямий, груди опускаються до опори.", "Mains sur un appui (banc, rebord). Corps droit, poitrine vers l'appui.", "Hands on a raised support (bench, ledge). Body straight, lower the chest toward it."], ["Kneeling push-up", "Колени на полу, тело одной линией от колен до головы. Сгибайте локти под 45 градусов к корпусу.", "Коліна на підлозі, тіло однією лінією від колін до голови. Згинайте лікті під 45 градусів до корпуса.", "Genoux au sol, corps en ligne des genoux à la tête. Coudes à 45 degrés du buste.", "Knees on the floor, body in line from knees to head. Elbows at 45 degrees to the torso."], ["Standard push-up", "Упор лежа, ладони под плечами, тело прямое. Опуститесь к полу и выжмите себя вверх.", "Упор лежачи, долоні під плечима, тіло пряме. Опустіться до підлоги й видавіть себе вгору.", "Position de planche, mains sous les épaules, corps droit. Descendez vers le sol et repoussez.", "Plank position, hands under shoulders, body straight. Lower toward the floor and press back up."], ["Close-grip push-up", "Руки уже плеч, локти прижаты к корпусу. Нагрузка больше на трицепс.", "Руки вужче плечей, лікті притиснуті до корпуса. Навантаження більше на трицепс.", "Mains plus serrées que les épaules, coudes près du corps. Plus de travail pour les triceps.", "Hands narrower than shoulders, elbows close to the body. More triceps work."], ["Wide-grip push-up", "Руки шире плеч. Нагрузка смещается на внешнюю часть груди, локти идут в стороны.", "Руки ширше плечей. Навантаження зміщується на зовнішню частину грудей, лікті йдуть убік.", "Mains plus larges que les épaules. La charge passe sur l'extérieur des pectoraux, coudes vers l'extérieur.", "Hands wider than shoulders. Load shifts to the outer chest, elbows flare out."], ["Diamond push-up", "Ладони вместе под грудью, пальцы образуют ромб. Локти прижаты, акцент на трицепс.", "Долоні разом під грудьми, пальці утворюють ромб. Лікті притиснуті, акцент на трицепс.", "Paumes ensemble sous la poitrine, doigts en losange. Coudes serrés, accent sur les triceps.", "Palms together under the chest, fingers forming a diamond. Elbows tucked, triceps emphasis."], ["Banded push-up", "Резинка проходит по спине и в руках. Отжимания с нарастающим сопротивлением вверху.", "Гумка проходить по спині й у руках. Віджимання з наростаючим опором угорі.", "La bande passe dans le dos et dans les mains. Pompes avec résistance croissante en haut.", "Band across the back and under the hands. Push-ups with rising resistance at the top."], ["Banded chest press", "Резинка за спиной. Выжимайте руки вперед от груди, локти слегка ниже плеч.", "Гумка за спиною. Видавлюйте руки вперед від грудей, лікті трохи нижче плечей.", "Bande dans le dos. Poussez les bras vers l'avant, coudes un peu sous les épaules.", "Band behind the back. Press the arms forward from the chest, elbows slightly below shoulders."], ["Dumbbell floor press", "Лежа на полу, гантели над грудью. Опускайте до касания локтями пола и выжимайте.", "Лежачи на підлозі, гантелі над грудьми. Опускайте до дотику ліктями підлоги й видавлюйте.", "Sur le sol, haltères au-dessus de la poitrine. Descendez jusqu'aux coudes au sol et poussez.", "Lying on the floor, dumbbells above the chest. Lower until elbows touch the floor, then press."], ["Dumbbell floor fly", "Лежа на полу, руки с гантелями слегка согнуты. Разводите их в стороны до пола и сводите над грудью.", "Лежачи на підлозі, руки з гантелями злегка зігнуті. Розводьте їх убік до підлоги й зводьте над грудьми.", "Sur le sol, bras légèrement fléchis avec haltères. Écartez jusqu'au sol puis rapprochez au-dessus de la poitrine.", "Lying on the floor, arms slightly bent holding dumbbells. Open them to the floor and bring them together above the chest."], ["Dumbbell pullover", "Лежа на полу, гантель двумя руками. Уводите ее за голову на прямых руках и возвращайте над грудью.", "Лежачи на підлозі, гантель двома руками. Відводьте її за голову на прямих руках і повертайте над грудьми.", "Sur le sol, haltère à deux mains. Amenez-la derrière la tête bras tendus et revenez au-dessus de la poitrine.", "Lying on the floor with a dumbbell in both hands. Take it overhead with straight arms and bring it back over the chest."], ["TRX push-up", "Руки в петлях TRX, тело одной линией. Опускайте грудь между ручками, не заваливая таз.", "Руки в петлях TRX, тіло однією лінією. Опускайте груди між ручками, не завалюючи таз.", "Mains dans les poignées TRX, corps en ligne. Descendez la poitrine entre les poignées, bassin stable.", "Hands in the TRX handles, body in one line. Lower the chest between the handles, hips stable."], ["TRX chest fly", "Лицом от точки крепления, руки в стороны на прямых руках, затем сводите перед грудью.", "Обличчям від точки кріплення, руки в боки на прямих руках, потім зводьте перед грудьми.", "Face opposée à l'ancrage, bras tendus ouverts puis ramenés devant la poitrine.", "Facing away from the anchor, open straight arms to the sides then bring them together in front of the chest."], ["Prone Y-T-W raise", "Лежа на животе, поднимайте руки по очереди в положения Y, T и W. Лопатки сводятся и опускаются.", "Лежачи на животі, піднімайте руки по черзі в положення Y, T і W. Лопатки зводяться й опускаються.", "À plat ventre, levez les bras successivement en Y, T et W. Les omoplates se rapprochent et descendent.", "Lying face down, raise the arms into Y, T and W shapes. Shoulder blades squeeze and move down."], ["Pike push-up", "Таз высоко, тело как перевернутая V. Опускайте голову к полу, нагрузка на плечи.", "Таз високо, тіло як перевернута V. Опускайте голову до підлоги, навантаження на плечі.", "Bassin haut, corps en V inversé. Descendez la tête vers le sol, travail des épaules.", "Hips high, body like an inverted V. Lower the head toward the floor, shoulders do the work."], ["Standing dumbbell shoulder press", "Гантели у плеч, жмите вверх до выпрямления рук. Ребра не раздвигаются, пресс напряжен.", "Гантелі біля плечей, жміть угору до випрямлення рук. Ребра не розходяться, прес напружений.", "Haltères aux épaules, poussez vers le haut jusqu'à l'extension. Côtes fermées, abdos serrés.", "Dumbbells at the shoulders, press overhead until arms are straight. Ribs down, abs tight."], ["Arnold press", "Гантели перед лицом ладонями к себе. Выжимая вверх, разворачивайте ладони вперед.", "Гантелі перед обличчям долонями до себе. Видавлюючи вгору, розвертайте долоні вперед.", "Haltères devant le visage, paumes vers vous. En poussant, tournez les paumes vers l'avant.", "Dumbbells in front of the face, palms toward you. As you press up, rotate the palms forward."], ["Dumbbell lateral raise", "Руки с гантелями вдоль тела, поднимайте в стороны до уровня плеч с мягкими локтями.", "Руки з гантелями вздовж тіла, піднімайте вбік до рівня плечей із м'якими ліктями.", "Bras le long du corps avec haltères, levez sur les côtés jusqu'aux épaules, coudes souples.", "Arms at your sides with dumbbells, raise to the sides up to shoulder height with soft elbows."], ["Dumbbell front raise", "Поднимайте гантели перед собой до уровня плеч, без раскачки корпусом.", "Піднімайте гантелі перед собою до рівня плечей, без розгойдування корпусом.", "Levez les haltères devant vous jusqu'aux épaules, sans balancer le buste.", "Raise the dumbbells in front to shoulder height, no body swing."], ["Bent-over rear delt raise", "Корпус наклонен вперед, спина прямая. Разводите гантели в стороны, лопатки сводятся.", "Корпус нахилений уперед, спина пряма. Розводьте гантелі вбік, лопатки зводяться.", "Buste penché, dos droit. Écartez les haltères sur les côtés, omoplates serrées.", "Torso hinged forward, back straight. Open the dumbbells to the sides, squeezing the shoulder blades."], ["Banded lateral raise", "Встаньте на резинку, поднимайте руки в стороны до уровня плеч.", "Станьте на гумку, піднімайте руки вбік до рівня плечей.", "Pieds sur la bande, levez les bras sur les côtés jusqu'aux épaules.", "Stand on the band and raise the arms to the sides up to shoulder height."], ["Banded overhead press", "Резинка под стопами, руки у плеч. Жмите вверх до выпрямления, корпус неподвижен.", "Гумка під стопами, руки біля плечей. Жміть угору до випрямлення, корпус нерухомий.", "Bande sous les pieds, mains aux épaules. Poussez vers le haut, buste immobile.", "Band under the feet, hands at the shoulders. Press overhead until straight, torso still."], ["TRX Y-raise", "Лицом к точке крепления, откинувшись назад. Поднимайте прямые руки вверх буквой Y.", "Обличчям до точки кріплення, відхилившись назад. Піднімайте прямі руки вгору літерою Y.", "Face à l'ancrage, penchée en arrière. Levez les bras tendus en Y.", "Facing the anchor, leaning back. Raise straight arms overhead into a Y shape."], ["TRX T-raise", "Лицом к точке крепления, откинувшись. Разводите прямые руки в стороны буквой T, лопатки сводятся.", "Обличчям до точки кріплення, відхилившись. Розводьте прямі руки вбік літерою T, лопатки зводяться.", "Face à l'ancrage, penchée en arrière. Écartez les bras tendus en T, omoplates serrées.", "Facing the anchor, leaning back. Open straight arms into a T, squeezing the shoulder blades."], ["Superman", "Лежа на животе, одновременно поднимайте руки, грудь и ноги. Шея нейтральна, пауза наверху.", "Лежачи на животі, одночасно піднімайте руки, груди й ноги. Шия нейтральна, пауза нагорі.", "À plat ventre, levez simultanément bras, poitrine et jambes. Nuque neutre, pause en haut.", "Lying face down, lift arms, chest and legs at once. Neck neutral, pause at the top."], ["Prone swimmers", "Лежа на животе, поочередно поднимайте противоположные руку и ногу, как при плавании.", "Лежачи на животі, почергово піднімайте протилежні руку й ногу, як під час плавання.", "À plat ventre, levez en alternance bras et jambe opposés, comme en nageant.", "Lying face down, alternately lift opposite arm and leg as if swimming."], ["TRX row", "Лицом к точке крепления, тело прямое. Подтягивайте грудь к ручкам, локти вдоль корпуса.", "Обличчям до точки кріплення, тіло пряме. Підтягуйте груди до ручок, лікті вздовж корпуса.", "Face à l'ancrage, corps droit. Tirez la poitrine vers les poignées, coudes près du corps.", "Facing the anchor, body straight. Pull the chest toward the handles with elbows close to the body."], ["TRX wide row", "Тяга TRX с локтями в стороны на уровне плеч. Акцент на среднюю часть спины и заднюю дельту.", "Тяга TRX із ліктями вбік на рівні плечей. Акцент на середню частину спини та задню дельту.", "Rowing TRX coudes écartés à hauteur des épaules. Accent sur le milieu du dos et l'arrière des épaules.", "TRX row with elbows out at shoulder height. Targets mid-back and rear shoulders."], ["TRX single-arm row", "Одна рука тянет TRX, корпус не вращается. Локоть идет назад вдоль тела.", "Одна рука тягне TRX, корпус не обертається. Лікоть іде назад уздовж тіла.", "Un bras tire le TRX, le buste ne tourne pas. Coude vers l'arrière le long du corps.", "One arm pulls the TRX without torso rotation. Elbow travels back along the body."], ["TRX face pull", "Тяните ручки к лицу, локти высоко и в стороны. Лопатки сводятся, плечи опущены.", "Тягніть ручки до обличчя, лікті високо й убік. Лопатки зводяться, плечі опущені.", "Tirez les poignées vers le visage, coudes hauts et écartés. Omoplates serrées, épaules basses.", "Pull the handles toward the face, elbows high and wide. Shoulder blades squeeze, shoulders stay down."], ["Supported single-arm dumbbell row", "Одна рука и колено на опоре. Тяните гантель к поясу, локоть вдоль корпуса.", "Одна рука й коліно на опорі. Тягніть гантель до пояса, лікоть уздовж корпуса.", "Une main et un genou en appui. Tirez l'haltère vers la hanche, coude près du corps.", "One hand and knee on a support. Row the dumbbell to the hip with the elbow close to the body."], ["Bent-over dumbbell row", "Корпус наклонен, спина прямая. Тяните обе гантели к поясу, лопатки сводятся.", "Корпус нахилений, спина пряма. Тягніть обидві гантелі до пояса, лопатки зводяться.", "Buste penché, dos droit. Tirez les deux haltères vers la taille, omoplates serrées.", "Torso hinged, back straight. Row both dumbbells to the waist, squeezing the shoulder blades."], ["Prone dumbbell row", "Лежа на животе, тяните гантели к ребрам, лопатки сводятся, шея нейтральна.", "Лежачи на животі, тягніть гантелі до ребер, лопатки зводяться, шия нейтральна.", "À plat ventre, tirez les haltères vers les côtes, omoplates serrées, nuque neutre.", "Lying face down, row the dumbbells toward the ribs, squeezing shoulder blades, neck neutral."], ["Seated band row", "Сидя, резинка вокруг стоп. Тяните к поясу, локти назад, лопатки сводятся.", "Сидячи, гумка навколо стоп. Тягніть до пояса, лікті назад, лопатки зводяться.", "Assise, bande autour des pieds. Tirez vers la taille, coudes en arrière, omoplates serrées.", "Seated with the band around the feet. Pull to the waist, elbows back, shoulder blades together."], ["Band lat pull-down", "Резинка закреплена сверху. Тяните ее вниз к груди, локти идут к бокам.", "Гумка закріплена зверху. Тягніть її вниз до грудей, лікті йдуть до боків.", "Bande fixée en hauteur. Tirez-la vers la poitrine, coudes vers les côtes.", "Band anchored overhead. Pull it down to the chest, elbows toward your sides."], ["Banded face pull", "Резинка на уровне лица. Тяните к лицу, локти высоко, лопатки сводятся.", "Гумка на рівні обличчя. Тягніть до обличчя, лікті високо, лопатки зводяться.", "Bande à hauteur du visage. Tirez vers le visage, coudes hauts, omoplates serrées.", "Band at face height. Pull toward the face with elbows high, squeezing the shoulder blades."], ["Band pull-apart", "Резинка в прямых руках перед грудью. Разводите руки в стороны до касания резинкой груди.", "Гумка в прямих руках перед грудьми. Розводьте руки вбік до дотику гумкою до грудей.", "Bande dans les bras tendus devant la poitrine. Écartez jusqu'à toucher la poitrine avec la bande.", "Band in straight arms at chest height. Pull apart until the band touches the chest."], ["Bench dip", "Руки сзади на опоре, ноги вперед. Сгибайте локти назад, опускаясь вертикально.", "Руки ззаду на опорі, ноги вперед. Згинайте лікті назад, опускаючись вертикально.", "Mains derrière sur un appui, jambes devant. Fléchissez les coudes vers l'arrière en descendant à la verticale.", "Hands behind you on a support, legs forward. Bend the elbows back, lowering straight down."], ["Close-grip push-up (triceps)", "Отжимание с локтями вдоль тела и руками чуть уже плеч. Акцент на трицепс.", "Віджимання з ліктями вздовж тіла й руками трохи вужче плечей. Акцент на трицепс.", "Pompe coudes le long du corps, mains un peu plus serrées que les épaules. Accent sur les triceps.", "Push-up with elbows along the body, hands slightly narrower than shoulders. Triceps focus."], ["Dumbbell biceps curl", "Локти прижаты к корпусу. Сгибайте руки с гантелями до плеч и медленно опускайте.", "Лікті притиснуті до корпуса. Згинайте руки з гантелями до плечей і повільно опускайте.", "Coudes collés au corps. Fléchissez les bras avec les haltères vers les épaules et redescendez lentement.", "Elbows pinned to the torso. Curl the dumbbells to the shoulders and lower slowly."], ["Hammer curl", "Гантели хватом «молоток» (ладони друг к другу). Сгибайте руки, локти у корпуса.", "Гантелі хватом «молоток» (долоні одна до одної). Згинайте руки, лікті біля корпуса.", "Haltères en prise marteau (paumes face à face). Fléchissez les bras, coudes près du corps.", "Dumbbells in a neutral grip, palms facing each other. Curl up with elbows at your sides."], ["Overhead dumbbell triceps extension", "Гантель двумя руками за головой, локти смотрят вверх. Выпрямляйте руки, локти не расходятся.", "Гантель двома руками за головою, лікті дивляться вгору. Випрямляйте руки, лікті не розходяться.", "Haltère à deux mains derrière la tête, coudes vers le haut. Tendez les bras sans écarter les coudes.", "Dumbbell in both hands behind the head, elbows up. Straighten the arms without flaring the elbows."], ["Dumbbell triceps kickback", "Корпус наклонен, локоть прижат к боку. Разгибайте руку назад до прямой линии.", "Корпус нахилений, лікоть притиснутий до боку. Розгинайте руку назад до прямої лінії.", "Buste penché, coude collé au côté. Tendez le bras vers l'arrière jusqu'à la ligne droite.", "Torso hinged, elbow pinned to the side. Extend the arm back until straight."], ["Band biceps curl", "Встаньте на резинку, сгибайте руки к плечам, локти неподвижны.", "Станьте на гумку, згинайте руки до плечей, лікті нерухомі.", "Pieds sur la bande, fléchissez les bras vers les épaules, coudes fixes.", "Stand on the band and curl to the shoulders, elbows still."], ["Band triceps pushdown", "Резинка закреплена сверху. Разгибайте руки вниз, локти прижаты к корпусу.", "Гумка закріплена зверху. Розгинайте руки вниз, лікті притиснуті до корпуса.", "Bande fixée en hauteur. Tendez les bras vers le bas, coudes collés au corps.", "Band anchored overhead. Push the arms down with elbows pinned to the torso."], ["TRX biceps curl", "Лицом к точке крепления, руки вытянуты. Сгибая локти, подтягивайте ладони ко лбу.", "Обличчям до точки кріплення, руки витягнуті. Згинаючи лікті, підтягуйте долоні до лоба.", "Face à l'ancrage, bras tendus. En fléchissant les coudes, ramenez les mains vers le front.", "Facing the anchor, arms extended. Bend the elbows to bring the hands toward the forehead."], ["TRX triceps extension", "Руки в петлях, корпус под наклоном, локти на уровне лба. Выпрямляйте руки вперед.", "Руки в петлях, корпус під нахилом, лікті на рівні лоба. Випрямляйте руки вперед.", "Mains dans les poignées, corps incliné, coudes à hauteur du front. Tendez les bras vers l'avant.", "Hands in the handles, body angled, elbows at forehead height. Straighten the arms forward."], ["Forearm plank", "Опора на предплечья и носки, тело одной линией. Пресс и ягодицы напряжены.", "Опора на передпліччя й носки, тіло однією лінією. Прес і сідниці напружені.", "Appui sur les avant-bras et les orteils, corps en ligne. Abdos et fessiers serrés.", "Support on forearms and toes, body in one line. Abs and glutes tight."], ["Kneeling plank", "Опора на предплечья и колени. Таз не провисает и не поднимается.", "Опора на передпліччя й коліна. Таз не провисає й не піднімається.", "Appui sur les avant-bras et les genoux. Le bassin ne s'affaisse ni ne monte.", "Support on forearms and knees. Hips neither sag nor pike."], ["Side plank", "Опора на предплечье и ступни, таз приподнят. Тело одной линией от головы до пяток.", "Опора на передпліччя й ступні, таз піднятий. Тіло однією лінією від голови до п'ят.", "Appui sur l'avant-bras et les pieds, bassin levé. Corps en ligne de la tête aux talons.", "Support on forearm and feet, hips lifted. Body in one line from head to heels."], ["Kneeling side plank", "Боковая планка с опорой на предплечье и колено. Таз приподнят, корпус ровный.", "Бокова планка з опорою на передпліччя й коліно. Таз піднятий, корпус рівний.", "Planche latérale sur l'avant-bras et le genou. Bassin levé, buste aligné.", "Side plank supported on forearm and knee. Hips lifted, torso straight."], ["Dead bug", "Лежа на спине, поясница прижата. Медленно опускайте противоположные руку и ногу и возвращайте.", "Лежачи на спині, поперек притиснутий. Повільно опускайте протилежні руку й ногу й повертайте.", "Sur le dos, bas du dos plaqué. Descendez lentement bras et jambe opposés puis revenez.", "On your back with the lower back pressed down. Slowly lower the opposite arm and leg and return."], ["Bird dog", "На четвереньках. Вытягивайте противоположные руку и ногу, корпус не качается.", "На четвереньках. Витягуйте протилежні руку й ногу, корпус не хитається.", "À quatre pattes. Tendez bras et jambe opposés, buste stable.", "On all fours. Extend opposite arm and leg while keeping the torso still."], ["Crunch", "Лежа, поднимайте лопатки от пола, подбородок не прижат к груди. Поясница на полу.", "Лежачи, піднімайте лопатки від підлоги, підборіддя не притиснуте до грудей. Поперек на підлозі.", "Allongée, décollez les omoplates, menton loin de la poitrine. Bas du dos au sol.", "Lying down, lift the shoulder blades, chin off the chest. Lower back stays on the floor."], ["Reverse crunch", "Лежа, колени согнуты. Подтягивайте колени к груди, отрывая таз от пола.", "Лежачи, коліна зігнуті. Підтягуйте коліна до грудей, відриваючи таз від підлоги.", "Allongée, genoux fléchis. Ramenez les genoux vers la poitrine en décollant le bassin.", "Lying down, knees bent. Pull the knees to the chest, lifting the hips off the floor."], ["Lying leg raise", "Лежа, ноги прямые. Поднимайте их до вертикали и опускайте без касания пола, поясница прижата.", "Лежачи, ноги прямі. Піднімайте їх до вертикалі й опускайте без дотику підлоги, поперек притиснутий.", "Allongée, jambes tendues. Levez-les à la verticale et descendez sans toucher le sol, bas du dos plaqué.", "Lying down with straight legs. Raise them to vertical and lower without touching the floor, lower back pressed."], ["Plank shoulder tap", "В высокой планке поочередно касайтесь ладонью противоположного плеча. Таз не раскачивается.", "У високій планці почергово торкайтеся долонею протилежного плеча. Таз не розгойдується.", "En planche haute, touchez en alternance l'épaule opposée. Le bassin ne bouge pas.", "From a high plank, tap the opposite shoulder with each hand. Hips stay still."], ["Hollow hold", "Лежа на спине, поднимите плечи и прямые ноги над полом, поясница прижата. Тело как лодочка.", "Лежачи на спині, підніміть плечі й прямі ноги над підлогою, поперек притиснутий. Тіло як човник.", "Sur le dos, plaquez le bas du dos, levez épaules et jambes tendues. Le corps forme un bateau.", "On your back, lift shoulders and straight legs, lower back pressed down. Body forms a boat shape."], ["Standing knee-to-elbow crunch", "Стоя, подтягивайте колено к противоположному локтю, скручивая корпус.", "Стоячи, підтягуйте коліно до протилежного ліктя, скручуючи корпус.", "Debout, ramenez le genou vers le coude opposé en tournant le buste.", "Standing, bring the knee toward the opposite elbow, rotating the torso."], ["Dumbbell Russian twist", "Сидя, корпус слегка откинут, ноги над полом. Перемещайте гантель из стороны в сторону, вращая корпус.", "Сидячи, корпус злегка відхилений, ноги над підлогою. Переміщуйте гантель із боку в бік, обертаючи корпус.", "Assise, buste légèrement incliné, pieds décollés. Déplacez l'haltère d'un côté à l'autre en tournant le buste.", "Seated, torso leaned back, feet off the floor. Move the dumbbell side to side, rotating the torso."], ["Dumbbell wood chop", "Гантель двумя руками. Движение по диагонали сверху вниз через корпус, как рубка дров.", "Гантель двома руками. Рух по діагоналі зверху вниз через корпус, як рубання дров.", "Haltère à deux mains. Mouvement diagonal de haut en bas à travers le buste, comme pour fendre du bois.", "Dumbbell in both hands. Move diagonally from high to low across the body, like chopping wood."], ["Dumbbell side bend", "Гантель в одной руке. Наклоняйтесь в сторону гантели и возвращайтесь, корпус в плоскости.", "Гантель в одній руці. Нахиляйтеся в бік гантелі й повертайтеся, корпус у площині.", "Haltère dans une main. Penchez-vous du côté de l'haltère puis revenez, buste dans un plan.", "Dumbbell in one hand. Bend toward the weight and return, keeping the torso in one plane."], ["Pallof press", "Резинка сбоку на уровне груди. Выжимайте руки вперед и удерживайте корпус от поворота.", "Гумка збоку на рівні грудей. Видавлюйте руки вперед і утримуйте корпус від повороту.", "Bande sur le côté à hauteur de poitrine. Poussez les bras devant vous sans laisser le buste tourner.", "Band at your side at chest height. Press the hands forward and resist rotation."], ["Band wood chop", "Резинка закреплена сбоку сверху. Тяните ее по диагонали вниз, поворачивая корпус.", "Гумка закріплена збоку зверху. Тягніть її по діагоналі вниз, повертаючи корпус.", "Bande fixée en haut sur le côté. Tirez-la en diagonale vers le bas en tournant le buste.", "Band anchored high to the side. Pull it diagonally down, rotating the torso."], ["TRX plank", "Стопы в петлях, руки на полу. Держите тело прямым, таз не проваливается.", "Стопи в петлях, руки на підлозі. Тримайте тіло прямим, таз не провалюється.", "Pieds dans les sangles, mains au sol. Corps droit, bassin stable.", "Feet in the straps, hands on the floor. Keep the body straight, keep the hips from sagging."], ["TRX saw", "Предплечья на полу, стопы в петлях. Раскачивайтесь вперед-назад на предплечьях, корпус прямой.", "Передпліччя на підлозі, стопи в петлях. Розгойдуйтеся вперед-назад на передпліччях, корпус прямий.", "Avant-bras au sol, pieds dans les sangles. Balancez-vous d'avant en arrière, corps droit.", "Forearms on the floor, feet in the straps. Rock forward and back on the forearms, body straight."], ["TRX mountain climbers", "Стопы в петлях, упор лежа. Поочередно подтягивайте колени к груди.", "Стопи в петлях, упор лежачи. Почергово підтягуйте коліна до грудей.", "Pieds dans les sangles, position de planche. Ramenez les genoux vers la poitrine en alternance.", "Feet in the straps in a plank. Alternately drive the knees toward the chest."], ["TRX knee tuck", "Стопы в петлях, упор лежа. Подтягивайте колени к груди и возвращайте ноги назад.", "Стопи в петлях, упор лежачи. Підтягуйте коліна до грудей і повертайте ноги назад.", "Pieds dans les sangles, planche. Ramenez les genoux vers la poitrine puis étendez les jambes.", "Feet in the straps in a plank. Tuck the knees to the chest, then extend the legs."], ["High-knee march", "Идите на месте, высоко поднимая колени, руки работают в противофазе. Без прыжков.", "Ідіть на місці, високо піднімаючи коліна, руки працюють у протифазі. Без стрибків.", "Marchez sur place en montant haut les genoux, bras en opposition. Sans sauter.", "March in place lifting the knees high, arms in opposition. No jumping."], ["Side step with arm swing", "Шаги в стороны с махами рук над головой. Темп ровный, без прыжков.", "Кроки вбік із помахами рук над головою. Темп рівний, без стрибків.", "Pas latéraux avec balancement des bras au-dessus de la tête. Rythme régulier, sans saut.", "Side steps with arm swings overhead. Even pace, no jumping."], ["Shadow boxing", "Стойка боксера, наносите быстрые удары в воздух, перенося вес на ноги.", "Стійка боксера, завдавайте швидких ударів у повітря, переносячи вагу на ноги.", "Garde de boxeuse, enchaînez des coups rapides dans le vide en transférant le poids.", "Boxing stance, throw fast punches into the air while shifting weight between the feet."], ["High-knee run", "Бег на месте с высоким подъемом колен, корпус прямой, руки работают активно.", "Біг на місці з високим підйомом колін, корпус прямий, руки працюють активно.", "Course sur place avec genoux hauts, buste droit, bras actifs.", "Run in place with high knees, torso upright, arms driving."], ["Jumping jack", "Прыжком разведите ноги и руки в стороны, затем вернитесь в исходное положение.", "Стрибком розведіть ноги й руки вбік, потім поверніться у вихідне положення.", "D'un saut, écartez jambes et bras, puis revenez au départ.", "Jump the legs and arms out to the sides, then jump back to the start."], ["Mountain climber", "Упор лежа. Быстро подтягивайте колени к груди поочередно, таз на уровне плеч.", "Упор лежачи. Швидко підтягуйте коліна до грудей почергово, таз на рівні плечей.", "Position de planche. Ramenez rapidement les genoux en alternance, bassin à hauteur des épaules.", "Plank position. Quickly drive the knees to the chest in alternation, hips level with shoulders."], ["Burpee (no push-up)", "Из стойки упор присев, прыжок ногами назад в планку, возврат и вставание. Без отжимания.", "Зі стійки упор присівши, стрибок ногами назад у планку, повернення й вставання. Без віджимання.", "Depuis debout, posez les mains, sautez en planche, revenez et redressez-vous. Sans pompe.", "From standing, hands down, jump back to a plank, return and stand. No push-up."], ["Jump squat", "Присед и мощный прыжок вверх. Приземляйтесь мягко, колени слегка согнуты.", "Присід і потужний стрибок угору. Приземляйтеся м'яко, коліна злегка зігнуті.", "Squat puis saut explosif. Réceptionnez en douceur, genoux légèrement fléchis.", "Squat then jump explosively. Land softly with knees slightly bent."], ["Skater hop", "Прыжки из стороны в сторону с приземлением на одну ногу, как у конькобежца.", "Стрибки з боку в бік із приземленням на одну ногу, як у ковзаняра.", "Sauts latéraux avec réception sur une jambe, comme un patineur.", "Hop side to side landing on one leg, like a speed skater."], ["Burpee", "Из стойки упор присев, планка, отжимание, прыжок ногами вперед и выпрыгивание вверх.", "Зі стійки упор присівши, планка, віджимання, стрибок ногами вперед і вистрибування вгору.", "Depuis debout, planche, pompe, retour des pieds et saut vertical.", "From standing, drop to a plank, push-up, jump feet in and jump up."], ["Dumbbell thruster", "Гантели у плеч. Присед, затем встаньте и одним движением выжмите гантели вверх.", "Гантелі біля плечей. Присід, потім встаньте й одним рухом видавіть гантелі вгору.", "Haltères aux épaules. Squat puis, en remontant, poussez les haltères au-dessus de la tête d'un seul mouvement.", "Dumbbells at the shoulders. Squat, then stand and press the dumbbells overhead in one motion."], ["Shoulder rolls", "Круговые движения плечами вперед и назад, амплитуда максимальная, шея расслаблена.", "Колові рухи плечима вперед і назад, амплітуда максимальна, шия розслаблена.", "Cercles des épaules vers l'avant puis vers l'arrière, grande amplitude, nuque relâchée.", "Roll the shoulders forward and back with full range, neck relaxed."], ["Cat-cow", "На четвереньках: на выдохе округляйте спину, на вдохе прогибайтесь. Плавно и в темпе дыхания.", "На четвереньках: на видиху округлюйте спину, на вдиху прогинайтеся. Плавно й у темпі дихання.", "À quatre pattes : dos rond à l'expiration, dos creux à l'inspiration. Lentement, au rythme du souffle.", "On all fours: round the back as you exhale, arch as you inhale. Smooth, matching your breath."], ["Standing hip circles", "Руки на поясе, делайте большие круги тазом в обе стороны, колени слегка согнуты.", "Руки на поясі, робіть великі кола тазом в обидва боки, коліна злегка зігнуті.", "Mains sur les hanches, grands cercles du bassin dans les deux sens, genoux souples.", "Hands on hips, draw big hip circles in both directions, knees soft."], ["Thoracic opener", "Лежа на боку, колени согнуты. Раскрывайте верхнюю руку назад, следуя за ней взглядом.", "Лежачи на боці, коліна зігнуті. Розкривайте верхню руку назад, стежачи за нею поглядом.", "Sur le côté, genoux fléchis. Ouvrez le bras du dessus vers l'arrière en suivant du regard.", "On your side, knees bent. Open the top arm backward, following it with your eyes."], ["World's greatest stretch", "Глубокий выпад, рука на полу, поворот корпуса к передней ноге с поднятой рукой вверх.", "Глибокий випад, рука на підлозі, поворот корпуса до передньої ноги з піднятою рукою вгору.", "Grande fente, une main au sol, rotation du buste vers la jambe avant bras levé.", "Deep lunge, hand on the floor, rotate the torso toward the front leg with the arm reaching up."], ["Glute activation bridge", "Мостик без нагрузки, 2 секунды удержания наверху. Цель: включить ягодицы перед основной частью.", "Місток без навантаження, 2 секунди утримання нагорі. Мета: увімкнути сідниці перед основною частиною.", "Pont sans charge, 2 secondes en haut. But : réveiller les fessiers avant la séance.", "Unweighted bridge with a 2-second hold at the top. Goal: wake up the glutes before the main work."], ["Leg swing", "Держась за опору, махайте ногой вперед и назад свободно, корпус неподвижен.", "Тримаючись за опору, махайте ногою вперед і назад вільно, корпус нерухомий.", "En vous tenant, balancez la jambe d'avant en arrière librement, buste stable.", "Holding a support, swing the leg forward and back freely, torso still."], ["Light jog in place", "Легкий бег на месте, мягкие стопы, плечи расслаблены. Цель: разогреть тело.", "Легкий біг на місці, м'які стопи, плечі розслаблені. Мета: розігріти тіло.", "Petit footing sur place, appuis souples, épaules relâchées. But : échauffer le corps.", "Light jog in place with soft feet and relaxed shoulders. Goal: warm up the body."], ["Ankle mobility", "Колено уходит вперед над носком, пятка не отрывается от пола. Раскачивайте мягко.", "Коліно йде вперед над носком, п'ята не відривається від підлоги. Розгойдуйте м'яко.", "Genou vers l'avant au-dessus de l'orteil, talon au sol. Balancez doucement.", "Drive the knee forward over the toes with the heel on the floor. Rock gently."], ["Inchworm walk-out", "Из наклона уходите руками вперед в планку, затем подтягивайте стопы к рукам.", "З нахилу відходьте руками вперед у планку, потім підтягуйте стопи до рук.", "Depuis la flexion avant, marchez avec les mains jusqu'en planche, puis ramenez les pieds.", "From a forward fold walk the hands out to a plank, then walk the feet back to the hands."], ["Standing torso rotation", "Ноги на ширине плеч, руки на груди. Поворачивайте корпус из стороны в сторону, таз неподвижен.", "Ноги на ширині плечей, руки на груди. Повертайте корпус із боку в бік, таз нерухомий.", "Pieds écartés, mains sur la poitrine. Tournez le buste d'un côté à l'autre, bassin fixe.", "Feet shoulder-width, hands on chest. Rotate the torso side to side with hips still."], ["TRX assisted deep squat", "Держитесь за TRX, опускайтесь в глубокий присед, пятки на полу, грудь вверх.", "Тримайтеся за TRX, опускайтеся в глибокий присід, п'яти на підлозі, груди вгору.", "Tenez le TRX, descendez en squat profond, talons au sol, poitrine haute.", "Hold the TRX and lower into a deep squat, heels down, chest up."], ["Band shoulder activation", "Резинка в руках, разведите руки в стороны и вверх. Лопатки аккуратно сводятся.", "Гумка в руках, розведіть руки вбік і вгору. Лопатки акуратно зводяться.", "Bande dans les mains, écartez les bras sur les côtés et vers le haut. Omoplates serrées doucement.", "Band in hands, open the arms out and up. Shoulder blades gently squeeze."], ["Lateral band walk (activation)", "Резинка над коленями, полуприсед. Мелкие шаги в стороны для разогрева ягодиц.", "Гумка над колінами, напівприсід. Дрібні кроки вбік для розігріву сідниць.", "Bande au-dessus des genoux, demi-squat. Petits pas latéraux pour réveiller les fessiers.", "Band above the knees, half squat. Small side steps to warm up the glutes."], ["Hip flexor stretch", "Выпад на колено, таз подан вперед, корпус прямой. Растяжение спереди бедра задней ноги.", "Випад на коліно, таз поданий уперед, корпус прямий. Розтягнення спереду стегна задньої ноги.", "Fente genou au sol, bassin poussé vers l'avant, buste droit. Étirement à l'avant de la hanche arrière.", "Kneeling lunge with the hips pushed forward, torso upright. Stretch at the front of the back hip."], ["Hamstring stretch", "Одна нога вперед на пятке, корпус наклоняется с прямой спиной. Ощущение растяжения сзади бедра.", "Одна нога вперед на п'яті, корпус нахиляється з прямою спиною. Відчуття розтягнення ззаду стегна.", "Une jambe devant sur le talon, penchez le buste dos droit. Étirement à l'arrière de la cuisse.", "One leg forward on the heel, hinge forward with a straight back. Feel the stretch at the back of the thigh."], ["Figure-4 glute stretch", "Лежа или сидя, лодыжка на противоположном колене. Притягивайте ногу к груди.", "Лежачи або сидячи, щиколотка на протилежному коліні. Притягуйте ногу до грудей.", "Allongée ou assise, cheville sur le genou opposé. Ramenez la jambe vers la poitrine.", "Lying or seated, ankle on the opposite knee. Pull the leg toward the chest."], ["Standing quad stretch", "Стоя, потяните пятку к ягодице, колени вместе, таз подан вперед.", "Стоячи, потягніть п'яту до сідниці, коліна разом, таз поданий уперед.", "Debout, ramenez le talon vers la fesse, genoux joints, bassin en avant.", "Standing, pull the heel to the glute, knees together, hips forward."], ["Child's pose", "На коленях, таз к пяткам, руки вытянуты вперед. Расслабьте спину и дышите.", "На колінах, таз до п'ят, руки витягнуті вперед. Розслабте спину й дихайте.", "À genoux, bassin vers les talons, bras tendus devant. Relâchez le dos et respirez.", "Kneel with hips toward the heels, arms extended forward. Relax the back and breathe."], ["Supine spinal twist", "Лежа на спине, колени уводите в сторону, плечи на полу, взгляд в противоположную сторону.", "Лежачи на спині, коліна відводьте вбік, плечі на підлозі, погляд у протилежний бік.", "Sur le dos, genoux d'un côté, épaules au sol, regard de l'autre côté.", "On your back, drop the knees to one side, shoulders on the floor, gaze the other way."], ["Triceps stretch", "Рука за голову, локоть вверх. Другой рукой мягко притяните локоть в сторону.", "Рука за голову, лікоть угору. Другою рукою м'яко притягніть лікоть убік.", "Bras derrière la tête, coude en haut. De l'autre main, tirez doucement le coude.", "Arm behind the head, elbow up. Use the other hand to gently pull the elbow."], ["Butterfly stretch", "Сидя, подошвы вместе, колени в стороны. Корпус слегка наклонен вперед.", "Сидячи, підошви разом, коліна врізнобіч. Корпус злегка нахилений уперед.", "Assise, plantes de pieds jointes, genoux écartés. Buste légèrement penché.", "Seated with soles together, knees open. Lean the torso slightly forward."], ["Wall chest stretch", "Рука на стене на уровне плеча, корпус поворачивается в противоположную сторону.", "Рука на стіні на рівні плеча, корпус повертається в протилежний бік.", "Main contre le mur à hauteur d'épaule, tournez le buste du côté opposé.", "Hand on the wall at shoulder height, rotate the torso away."], ["Diaphragmatic breathing (rest)", "Лежа на спине, рука на животе. Вдох носом поднимает живот, выдох медленный.", "Лежачи на спині, рука на животі. Вдих носом піднімає живіт, видих повільний.", "Sur le dos, main sur le ventre. Inspirez par le nez en gonflant le ventre, expirez lentement.", "On your back with a hand on the belly. Inhale through the nose to lift the belly, exhale slowly."], ["TRX chest stretch", "Держитесь за ручки TRX, руки в стороны, наклоняйтесь вперед и раскрывайте грудь.", "Тримайтеся за ручки TRX, руки в боки, нахиляйтеся вперед і розкривайте груди.", "Tenez les poignées TRX, bras ouverts, penchez-vous en avant pour ouvrir la poitrine.", "Hold the TRX handles, arms out, lean forward to open the chest."], ["TRX lat stretch", "Держитесь за TRX, отклонитесь назад и тяните таз назад. Растяжка широчайших и плеч.", "Тримайтеся за TRX, відхиліться назад і тягніть таз назад. Розтягнення найширших і плечей.", "Tenez le TRX, penchez-vous en arrière et poussez le bassin en arrière. Étirement des grands dorsaux et épaules.", "Hold the TRX, lean back and push hips back. Stretches the lats and shoulders."], ["Diaphragmatic breathing with pelvic floor release", "Вдох: живот и ребра расширяются, тазовое дно мягко опускается. Выдох: возвращается.", "Вдих: живіт і ребра розширюються, тазове дно м'яко опускається. Видих: повертається.", "Inspiration : ventre et côtes s'élargissent, le plancher pelvien descend doucement. Expiration : il remonte.", "Inhale: belly and ribs expand, pelvic floor gently lowers. Exhale: it returns."], ["Kegel contractions", "Лежа, на выдохе сократите мышцы тазового дна, как будто останавливаете поток. На вдохе расслабьте.", "Лежачи, на видиху скоротіть м'язи тазового дна, ніби зупиняєте потік. На вдиху розслабте.", "Allongée, à l'expiration contractez le plancher pelvien comme pour retenir. À l'inspiration, relâchez.", "Lying down, exhale and contract the pelvic floor as if stopping a flow. Relax on the inhale."], ["Bridge with pelvic floor lift", "Поднимайте таз на выдохе с подтягиванием тазового дна, опускайте на вдохе с расслаблением.", "Піднімайте таз на видиху з підтягуванням тазового дна, опускайте на вдиху з розслабленням.", "Montez le bassin à l'expiration en engageant le plancher pelvien, redescendez à l'inspiration en relâchant.", "Lift the hips on the exhale with a pelvic floor lift, lower on the inhale while relaxing."], ["Pillow knee squeeze", "Подушка между колен, лежа. Сжимайте ее на выдохе, расслабляйте на вдохе.", "Подушка між колін, лежачи. Стискайте її на видиху, розслабляйте на вдиху.", "Coussin entre les genoux, allongée. Pressez-le à l'expiration, relâchez à l'inspiration.", "Pillow between the knees, lying down. Squeeze on the exhale, release on the inhale."], ["Breathing squat", "Присед на вдохе, подъем на выдохе с мягким подтягиванием тазового дна.", "Присід на вдиху, підйом на видиху з м'яким підтягуванням тазового дна.", "Descendez à l'inspiration, remontez à l'expiration en engageant doucement le plancher pelvien.", "Squat down on the inhale, rise on the exhale with a gentle pelvic floor lift."], ["Dead bug with exhale", "Мертвый жук, опускание руки и ноги на выдохе. Живот не выпячивается, давление низкое.", "Мертвий жук, опускання руки й ноги на видиху. Живіт не випинається, тиск низький.", "Dead bug, descente bras et jambe à l'expiration. Le ventre ne bombe pas, pression basse.", "Dead bug lowering arm and leg on the exhale. Belly does not bulge, intra-abdominal pressure stays low."], ["Happy baby pose", "Лежа на спине, колени к подмышкам, руки держат стопы. Расслабьте таз и дышите.", "Лежачи на спині, коліна до пахв, руки тримають стопи. Розслабте таз і дихайте.", "Sur le dos, genoux vers les aisselles, mains sur les pieds. Relâchez le bassin et respirez.", "On your back, knees toward the armpits, hands holding the feet. Relax the pelvis and breathe."], ["Cat-cow with breathing", "Кошка-корова в темпе дыхания: выдох с округлением спины и подъемом тазового дна.", "Кішка-корова в темпі дихання: видих із округленням спини й підйомом тазового дна.", "Chat-vache au rythme du souffle : expiration dos rond avec engagement du plancher pelvien.", "Cat-cow paced with the breath: exhale while rounding the back with a pelvic floor lift."], ["Deep squat hold", "Глубокий присед, пятки на полу, спина прямая, локти внутри колен. Удерживайте позу.", "Глибокий присід, п'яти на підлозі, спина пряма, лікті всередині колін. Утримуйте позу.", "Squat profond, talons au sol, dos droit, coudes à l'intérieur des genoux. Tenez la position.", "Deep squat, heels down, back straight, elbows inside the knees. Hold the position."], ["TRX toe squat with forward jump", "Спиной к точке крепления, на носках, присед и выпрыгивание вперед на мягкие ноги.", "Спиною до точки кріплення, на носках, присід і вистрибування вперед на м'які ноги.", "Dos à l'ancrage, sur la pointe des pieds, squat puis saut vers l'avant en réception souple.", "Back to the anchor, on your toes, squat then jump forward and land softly."], ["Wide squat with alternating knee-in", "Широкий присед, поочередно подводите колено к центру. Таз остается низко.", "Широкий присід, почергово підводьте коліно до центру. Таз залишається низько.", "Squat large, ramenez les genoux vers le centre en alternance. Bassin bas.", "Wide squat, alternately drive each knee toward the center. Hips stay low."], ["Narrow-stance toe squat", "Присед на носках с узкой стойкой. Пятки остаются приподнятыми.", "Присід на носках із вузькою стійкою. П'яти залишаються піднятими.", "Squat sur la pointe des pieds, appui serré. Talons restent levés.
