", "Narrow squat on the toes with the heels staying lifted."], ["Wide squat with toe rolls", "В широком приседе перекатывайтесь с пяток на носки. Мобилизует стопы и тазобедренные суставы.", "У широкому присіді перекочуйтеся з п'ят на носки. Мобілізує стопи й тазостегнові суглоби.", "En squat large, roulez des talons vers les orteils. Mobilise pieds et hanches.", "In a wide squat, roll from heels to toes. Mobilizes the feet and hips."], ["Deep squat with calf raise", "Глубокий присед, затем в нижней точке поднимайтесь на носки и опускайтесь.", "Глибокий присід, потім у нижній точці піднімайтеся на носки й опускайтеся.", "Squat profond, puis en bas montez sur les pointes et redescendez.", "Deep squat, then rise onto the toes and lower at the bottom."], ["Single-leg squat, ankle on knee", "Лодыжка свободной ноги на колене опорной. Присед на одной ноге, корпус слегка наклонен.", "Щиколотка вільної ноги на коліні опорної. Присід на одній нозі, корпус злегка нахилений.", "Cheville de la jambe libre sur le genou d'appui. Squat sur une jambe, buste légèrement penché.", "Free ankle rests on the standing knee. Squat on one leg with a slight forward lean."], ["Single-leg squat to reverse lunge", "На одной ноге присед, затем шаг назад в выпад и возврат. Работа на баланс и силу.", "На одній нозі присід, потім крок назад у випад і повернення. Робота на баланс і силу.", "Squat sur une jambe, puis pas en arrière en fente et retour. Équilibre et force.", "Squat on one leg, then step back into a lunge and return. Balance and strength."], ["TRX reverse squat (straps under the arms)", "Спиной к точке крепления, ручки под мышками. Присед с опорой на стропы.", "Спиною до точки кріплення, ручки під пахвами. Присід з опорою на стропи.", "Dos à l'ancrage, poignées sous les aisselles. Squat avec appui sur les sangles.", "Back to the anchor, handles under the armpits. Squat supported by the straps."], ["TRX lean-back squat with pull", "Лицом к точке крепления, присед с отклонением назад, подтягивайтесь к стропам при вставании.", "Обличчям до точки кріплення, присід із відхиленням назад, підтягуйтеся до строп під час вставання.", "Face à l'ancrage, squat penché en arrière, tirez vers les sangles en remontant.", "Facing the anchor, squat leaning back and pull toward the straps as you rise."], ["TRX heel squat with lean and pull", "Лицом к точке крепления, присед на пятках с наклоном и подтягиванием на одной ноге.", "Обличчям до точки кріплення, присід на п'ятах із нахилом і підтягуванням на одній нозі.", "Face à l'ancrage, squat sur les talons avec inclinaison et traction, sur une jambe.", "Facing the anchor, heel-loaded squat with a lean and pull, on one leg."], ["Deep lateral lunge", "Широкий шаг в сторону, глубокая посадка на одну ногу, стопа полностью на полу.", "Широкий крок убік, глибока посадка на одну ногу, стопа повністю на підлозі.", "Grand pas latéral, assise profonde sur une jambe, pied entièrement au sol.", "Wide side step, sit deep onto one leg with the whole foot on the floor."], ["Pulsing static lunge", "В нижней точке выпада делайте короткие пульсирующие движения вверх-вниз на 5-10 см.", "У нижній точці випаду робіть короткі пульсуючі рухи вгору-вниз на 5-10 см.", "En bas de la fente, faites de petites pulsations de 5 à 10 cm.", "At the bottom of the lunge, pulse up and down 5 to 10 cm."], ["Reverse lunge with knee drive", "Шаг назад в выпад, на возврате мах свободной ногой вперед-вверх.", "Крок назад у випад, на поверненні мах вільною ногою вперед-вгору.", "Pas en arrière en fente, au retour balancez la jambe libre vers l'avant et le haut.", "Step back into a lunge and on the return swing the free leg forward and up."], ["Cross-behind lunge with knee drive", "Выпад назад накрест за опорную ногу, затем колено к груди. Равновесие на одной ноге.", "Випад назад навхрест за опорну ногу, потім коліно до грудей. Рівновага на одній нозі.", "Fente croisée en arrière, puis genou vers la poitrine. Équilibre sur une jambe.", "Cross-behind reverse lunge, then drive the knee to the chest. Balance on one leg."], ["TRX forward lunge, arms up", "Спиной к точке крепления, выпад вперед и поднятие рук вверх в TRX.", "Спиною до точки кріплення, випад уперед і підняття рук угору в TRX.", "Dos à l'ancrage, fente avant avec bras levés dans le TRX.", "Back to the anchor, lunge forward with arms raised in the TRX."], ["TRX reverse lunge with knee raise", "Нога в петле уходит назад в выпад, на возврате колено подтягивается вверх.", "Нога в петлі йде назад у випад, на поверненні коліно підтягується вгору.", "Pied dans la sangle en fente arrière, au retour le genou monte.", "Foot in the strap goes back into a lunge, and on the return the knee lifts."], ["TRX side lunge with foot in strap", "Опорная нога стоит, свободная в петле уходит в сторону, корпус наклоняется вперед.", "Опорна нога стоїть, вільна в петлі йде вбік, корпус нахиляється вперед.", "Jambe d'appui fixe, l'autre dans la sangle glisse sur le côté, buste penché.", "Standing leg fixed, the strapped leg slides to the side, torso leans forward."], ["TRX forward lunge, foot in strap", "Нога в петле вперед по растяжке, корпус прямой. Плавно в пределах комфортной амплитуды.", "Нога в петлі вперед по розтяжці, корпус прямий. Плавно в межах комфортної амплітуди.", "Pied dans la sangle vers l'avant, buste droit. Amplitude confortable et fluide.", "Strapped foot travels forward, torso upright. Smooth, within a comfortable range."], ["Wide lateral lunge with leg raise", "Широкий боковой выпад, затем свободную ногу поднимите в сторону. Баланс и ягодицы.", "Широкий боковий випад, потім вільну ногу підніміть убік. Баланс і сідниці.", "Grande fente latérale, puis levez la jambe libre sur le côté. Équilibre et fessiers.", "Wide side lunge, then lift the free leg to the side. Balance and glutes."], ["Wide stance side lunge to kneeling lunge", "В широкой стойке чередуйте боковой выпад и выпад на колено. Меняйте направление плавно.", "У широкій стійці чергуйте боковий випад і випад на коліно. Змінюйте напрямок плавно.", "En appui large, alternez fente latérale et fente genou au sol. Changez de direction avec fluidité.", "In a wide stance alternate a side lunge and a kneeling lunge. Change direction smoothly."], ["Single-leg Romanian deadlift at the wall", "Рука или стопа свободной ноги у стены для баланса. Наклон на одной ноге, спина прямая.", "Рука або стопа вільної ноги біля стіни для балансу. Нахил на одній нозі, спина пряма.", "Main ou pied libre contre le mur pour l'équilibre. Penchez-vous sur une jambe, dos droit.", "Hand or free foot at the wall for balance. Hinge on one leg with a straight back."], ["Single-leg RDL with dumbbell and TRX hold", "Гантель в одной руке, другой рукой держите TRX. Наклон на одной ноге в балансе.", "Гантель в одній руці, іншою рукою тримайте TRX. Нахил на одній нозі в балансі.", "Haltère dans une main, l'autre tient le TRX. Penchez-vous sur une jambe en équilibre.", "Dumbbell in one hand, the other holds the TRX. Hinge on one leg in balance."], ["Romanian deadlift with torso rotation", "Румынская тяга с гантелью, внизу поверните корпус и вернитесь. Таз остается ровным.", "Румунська тяга з гантелею, внизу поверніть корпус і поверніться. Таз залишається рівним.", "Soulevé de terre roumain avec haltère, en bas tournez le buste puis revenez. Bassin stable.", "Romanian deadlift with a dumbbell, rotate the torso at the bottom then return. Hips stay level."], ["TRX kneeling lean-forward", "На коленях, спиной к точке крепления, стропы в руках. Подавайте бедра вперед и возвращайтесь.", "На колінах, спиною до точки кріплення, стропи в руках. Подавайте стегна вперед і повертайтеся.", "À genoux, dos à l'ancrage, sangles en mains. Poussez les hanches vers l'avant puis revenez.", "Kneeling with your back to the anchor, straps in hands. Drive the hips forward and return."], ["Single-leg bridge, other leg on the knee", "Одна лодыжка на колене, поднимайте таз на одной ноге, таз ровно.", "Одна щиколотка на коліні, піднімайте таз на одній нозі, таз рівно.", "Une cheville sur le genou, montez le bassin sur une jambe, bassin stable.", "One ankle on the opposite knee, lift the hips on a single leg, pelvis level."], ["Glute bridge with knee abduction", "Мостик, наверху разведите колени в стороны и сведите. Ягодицы напряжены.", "Місток, нагорі розведіть коліна вбік і зведіть. Сідниці напружені.", "Pont, en haut écartez les genoux puis rapprochez. Fessiers serrés.", "Bridge, at the top open the knees apart and close. Glutes stay tight."], ["Straight-leg glute bridge with spread", "Лежа, ноги прямые вверх над тазом. Поднимайте таз и разводите ноги в стороны.", "Лежачи, ноги прямі вгору над тазом. Піднімайте таз і розводьте ноги вбік.", "Allongée, jambes tendues en l'air. Montez le bassin et écartez les jambes.", "Lying with straight legs up over the hips. Lift the hips and open the legs apart."], ["Reverse plank hip lift", "В обратной планке опускайте таз к полу и поднимайте до прямой линии, ягодицы напряжены.", "В зворотній планці опускайте таз до підлоги й піднімайте до прямої лінії, сідниці напружені.", "En planche inversée, descendez le bassin puis remontez en ligne droite, fessiers serrés.", "From a reverse plank, lower the hips and lift to a straight line, glutes tight."], ["TRX single-leg bridge, ankle on knee", "Одна лодыжка на колене, другая стопа в петле TRX. Поднимайте таз усилием одной ноги.", "Одна щиколотка на коліні, інша стопа в петлі TRX. Піднімайте таз зусиллям однієї ноги.", "Une cheville sur le genou, l'autre pied dans la sangle. Montez le bassin sur une jambe.", "One ankle on the knee, the other foot in the TRX strap. Lift the hips using one leg."], ["TRX bridge, legs at 90°, knee spread", "Стопы в петлях, ноги согнуты. Поднимайте таз и разводите колени, не теряя положения.", "Стопи в петлях, ноги зігнуті. Піднімайте таз і розводьте коліна, не втрачаючи положення.", "Pieds dans les sangles, genoux fléchis. Montez le bassin et écartez les genoux.", "Feet in the straps, knees bent. Lift the hips and open the knees without losing position."], ["High TRX bridge with alternating knee bends", "Стопы в петлях, высокий мостик. Поочередно сгибайте колени, таз остается наверху.", "Стопи в петлях, високий місток. Почергово згинайте коліна, таз залишається нагорі.", "Pieds dans les sangles, pont haut. Fléchissez les genoux en alternance, bassin en haut.", "Feet in the straps, high bridge. Alternately bend the knees while the hips stay up."], ["TRX bridge with pull to the straps", "Стопы в петлях, мостик, подтягивайте себя руками к стропам для движения туловища.", "Стопи в петлях, місток, підтягуйте себе руками до строп для руху тулуба.", "Pieds dans les sangles, pont, tirez-vous avec les bras vers les sangles.", "Feet in the straps, bridge, pull yourself with the arms toward the straps."], ["TRX single-leg bridge with leg push-up", "Одна нога в петле, вторая направляется вверх. Таз поднимается и опускается.", "Одна нога в петлі, друга спрямовується вгору. Таз піднімається й опускається.", "Un pied dans la sangle, l'autre jambe pousse vers le haut. Le bassin monte et descend.", "One foot in the strap, the other leg pushes up. The hips rise and lower."], ["Crab walk", "В приседе боком шагайте в сторону, колени разведены, спина прямая.", "У присіді боком крокуйте вбік, коліна розведені, спина пряма.", "En squat, marchez de côté, genoux ouverts, dos droit.", "In a squat, walk sideways with knees open and back straight."], ["Crab walk with pulse", "Крабик боком, на последнем шаге сделайте пружинку в приседе.", "Крабик боком, на останньому кроці зробіть пружинку в присіді.", "Marche en crabe, au dernier pas faites une pulsation en squat.", "Crab walk sideways, then add a pulse in the squat on the last step."], ["Squat with side leg swing", "Присед, затем прямую ногу уведите в сторону. Корпус стабилен, опорное колено над стопой.", "Присід, потім пряму ногу відведіть убік. Корпус стабільний, опорне коліно над стопою.", "Squat puis envoyez la jambe tendue sur le côté. Buste stable, genou d'appui dans l'axe.", "Squat, then swing the straight leg to the side. Torso stable, standing knee over the foot."], ["Side leg swing with lunge", "Мах ногой в сторону, затем выпад на опорной ноге. Работа ягодиц и баланс.", "Мах ногою вбік, потім випад на опорній нозі. Робота сідниць і баланс.", "Balancement de jambe sur le côté, puis fente sur la jambe d'appui. Fessiers et équilibre.", "Swing the leg to the side, then lunge on the standing leg. Glutes and balance."], ["Knee drive and kickback", "Подтяните колено к груди, затем отведите ногу назад. Корпус ровный.", "Підтягніть коліно до грудей, потім відведіть ногу назад. Корпус рівний.", "Ramenez le genou vers la poitrine, puis envoyez la jambe en arrière. Buste droit.", "Pull the knee to the chest, then kick the leg back. Torso level."], ["Quadruped leg swing up and out", "На четвереньках, нога поднимается назад-вверх и в сторону. Таз остается ровным.", "На четвереньках, нога піднімається назад-вгору й убік. Таз залишається рівним.", "À quatre pattes, la jambe monte vers l'arrière puis sur le côté. Bassin stable.", "On all fours, swing the leg back and up then out to the side. Hips stay level."], ["TRX knee push-up", "Руки в петлях, колени на полу. Опускайте грудь между ручками, тело прямое.", "Руки в петлях, коліна на підлозі. Опускайте груди між ручками, тіло пряме.", "Mains dans les poignées, genoux au sol. Poitrine entre les poignées, corps droit.", "Hands in the handles, knees on the floor. Lower the chest between the handles, body straight."], ["TRX push-up facing away (straps under arms)", "Спиной к точке крепления, стропы под мышками. Опускайте грудь вперед, руки вдоль корпуса.", "Спиною до точки кріплення, стропи під пахвами. Опускайте груди вперед, руки вздовж корпуса.", "Dos à l'ancrage, sangles sous les aisselles. Descendez la poitrine vers l'avant, bras le long du corps.", "Back to the anchor, straps under the armpits. Lower the chest forward with arms along the body."], ["TRX forearm push-up (elbows in straps)", "Локти в петлях, грудь идет вперед. Выжимайте тело, сохраняя прямую линию.", "Лікті в петлях, груди йдуть уперед. Видавлюйте тіло, зберігаючи пряму лінію.", "Coudes dans les sangles, poitrine vers l'avant. Poussez en gardant le corps droit.", "Elbows in the straps, chest travels forward. Press up keeping the body straight."], ["TRX single-arm push-up", "Спиной к точке крепления, работает одна рука, вторая прямая в сторону. Корпус стабилен.", "Спиною до точки кріплення, працює одна рука, друга пряма вбік. Корпус стабільний.", "Dos à l'ancrage, un seul bras travaille, l'autre tendu sur le côté. Buste stable.", "Back to the anchor, one arm works while the other stays out straight. Torso stable."], ["TRX forearm fly", "На предплечьях, грудь проваливается вперед между стропами и возвращается. Работают грудь и плечи.", "На передпліччях, груди провалюються вперед між стропами й повертаються. Працюють груди й плечі.", "Sur les avant-bras, la poitrine s'enfonce vers l'avant puis revient. Pectoraux et épaules.", "On the forearms, sink the chest forward between the straps and return. Chest and shoulders work."], ["TRX forearm chest opener", "На предплечьях, грудь опускается вперед, раскрывая плечи. Контролируйте амплитуду.", "На передпліччях, груди опускаються вперед, розкриваючи плечі. Контролюйте амплітуду.", "Sur les avant-bras, la poitrine descend en ouvrant les épaules. Contrôlez l'amplitude.", "On the forearms, let the chest sink forward and open the shoulders. Control the range."], ["TRX suspended push-up", "Ноги в петлях, руки на полу. Отжимайтесь, удерживая тело и таз ровными.", "Ноги в петлях, руки на підлозі. Віджимайтеся, утримуючи тіло й таз рівними.", "Pieds dans les sangles, mains au sol. Faites des pompes en gardant corps et bassin alignés.", "Feet in the straps, hands on the floor. Push up keeping body and hips level."], ["Push-up with hand walk-out", "Упор лежа, отжимание, затем шаги руками вперед и назад. Корпус напряжен.", "Упор лежачи, віджимання, потім кроки руками вперед і назад. Корпус напружений.", "En planche, pompe, puis marchez avec les mains vers l'avant et l'arrière. Gainage constant.", "From a plank, do a push-up then walk the hands out and back. Keep the core braced."], ["Rotational push-up", "Отжимание, наверху поверните корпус и поднимите одну руку вверх. Взгляд за рукой.", "Віджимання, нагорі поверніть корпус і підніміть одну руку вгору. Погляд за рукою.", "Pompe puis, en haut, tournez le buste et levez un bras. Regard sur la main.", "Push-up, then at the top rotate the torso and raise one arm. Eyes follow the hand."], ["TRX W-raise", "Лицом к точке крепления, локти согнуты. Разводите руки буквой W, лопатки сводятся.", "Обличчям до точки кріплення, лікті зігнуті. Розводьте руки літерою W, лопатки зводяться.", "Face à l'ancrage, coudes fléchis. Ouvrez les bras en W, omoplates serrées.", "Facing the anchor, elbows bent. Open the arms into a W, squeezing the shoulder blades."], ["High TRX W-raise", "Высокая W-разводка в TRX, локти выше, акцент на заднюю дельту и верх спины.", "Висока W-розводка в TRX, лікті вище, акцент на задню дельту й верх спини.", "W-raise TRX haut, coudes plus hauts, accent sur l'arrière des épaules et le haut du dos.", "Higher TRX W-raise with elbows raised, targeting rear shoulders and upper back."], ["TRX straight-arm circle", "Прямые руки в петлях, рисуйте большой круг, корпус неподвижен.", "Прямі руки в петлях, малюйте велике коло, корпус нерухомий.", "Bras tendus dans les poignées, dessinez un grand cercle, buste fixe.", "Straight arms in the handles, draw a big circle with the torso still."], ["TRX straight-arm half circle", "Лицом к точке крепления, прямые руки описывают полукруг. Контролируемый темп.", "Обличчям до точки кріплення, прямі руки описують півколо. Контрольований темп.", "Face à l'ancrage, bras tendus tracent un demi-cercle. Tempo contrôlé.", "Facing the anchor, straight arms draw a half circle at a controlled pace."], ["TRX 90-degree arm spread", "Спиной к точке крепления, руки под 90 градусов. Разводите руки в стороны, раскрывая грудь.", "Спиною до точки кріплення, руки під 90 градусів. Розводьте руки вбік, розкриваючи груди.", "Dos à l'ancrage, bras à 90 degrés. Écartez les bras en ouvrant la poitrine.", "Back to the anchor, arms at 90 degrees. Spread the arms open across the chest."], ["TRX alternating straight-arm spread", "Прямые руки в стороны в TRX, чередуйте стороны. Корпус ровный.", "Прямі руки вбік у TRX, чергуйте боки. Корпус рівний.", "Bras tendus sur les côtés dans le TRX, alternez les côtés. Buste droit.", "Straight arms out to the sides in the TRX, alternating sides. Torso level."], ["Wall angel", "Спина и руки у стены, скользите руками вверх и вниз. Поясница и затылок касаются стены.", "Спина й руки біля стіни, ковзайте руками вгору й вниз. Поперек і потилиця торкаються стіни.", "Dos et bras contre le mur, glissez les bras vers le haut et le bas. Lombaires et nuque au contact.", "Back and arms against the wall, slide the arms up and down. Lower back and head stay in contact."], ["Squat with overhead angel", "Присед, затем руки уходят вверх как ангел. Грудь раскрыта, плечи опущены.", "Присід, потім руки йдуть угору як ангел. Груди розкриті, плечі опущені.", "Squat, puis les bras montent en ange. Poitrine ouverte, épaules basses.", "Squat, then raise the arms overhead like an angel. Chest open, shoulders down."], ["TRX chest-level pull, elbows high", "Лицом к точке крепления, локти на уровне плеч. Тяните ручки к груди.", "Обличчям до точки кріплення, лікті на рівні плечей. Тягніть ручки до грудей.", "Face à l'ancrage, coudes à hauteur d'épaules. Tirez les poignées vers la poitrine.", "Facing the anchor, elbows at shoulder height. Pull the handles to the chest."], ["TRX single-arm side row", "Боком к точке крепления, тянет одна рука. Корпус остается ровным, не поворачивается.", "Боком до точки кріплення, тягне одна рука. Корпус залишається рівним, не повертається.", "De côté par rapport à l'ancrage, un bras tire. Buste stable, sans rotation.", "Standing sideways to the anchor, one arm rows. Torso stays level without rotating."], ["Single-arm pull along the ribs", "Тяга одной рукой вдоль ребер, вторая за спиной. Лопатка сводится к позвоночнику.", "Тяга однією рукою вздовж ребер, друга за спиною. Лопатка зводиться до хребта.", "Traction d'un bras le long des côtes, l'autre dans le dos. L'omoplate se rapproche de la colonne.", "Row one arm along the ribs with the other hand behind the back. The shoulder blade squeezes toward the spine."], ["TRX row with arm spread", "Тяга к груди с разведением рук в стороны. Акцент на заднюю дельту и среднюю часть спины.", "Тяга до грудей із розведенням рук убік. Акцент на задню дельту й середню частину спини.", "Rowing vers la poitrine avec écartement des bras. Accent sur l'arrière des épaules et le milieu du dos.", "Row to the chest while spreading the arms. Targets rear shoulders and mid-back."], ["TRX cross-body hug pull", "Под углом, скрестите руки перед собой как в объятии. Лопатки разводятся и сводятся.", "Під кутом, схрестіть руки перед собою як в обіймах. Лопатки розводяться й зводяться.", "En angle, croisez les bras devant vous comme une étreinte. Omoplates s'écartent puis se rapprochent.", "At an angle, cross the arms in front as a hug. Shoulder blades spread then squeeze."], ["TRX inverted row (under high straps)", "Лежа на спине под высокими стропами, подтягивайте грудь к ручкам.", "Лежачи на спині під високими стропами, підтягуйте груди до ручок.", "Sur le dos sous des sangles hautes, tirez la poitrine vers les poignées.", "Lying on your back under high straps, pull the chest toward the handles."], ["TRX seated high pull", "Сидя на полу, подтягивайтесь к высоким стропам. Спина прямая, лопатки опущены.", "Сидячи на підлозі, підтягуйтеся до високих строп. Спина пряма, лопатки опущені.", "Assise au sol, tirez vers les sangles hautes. Dos droit, omoplates basses.", "Seated on the floor, pull toward high straps. Back straight, shoulder blades down."], ["TRX deep squat pull", "В глубоком приседе, подтягивайте тело к стропам, уши между рук. Пятки на полу.", "У глибокому присіді, підтягуйте тіло до строп, вуха між руками. П'яти на підлозі.", "En squat profond, tirez vers les sangles, oreilles entre les bras. Talons au sol.", "From a deep squat, pull toward the straps with ears between the arms. Heels down."], ["TRX single-arm deep squat pull", "Из глубокого приседа тяга одной рукой. Корпус не поворачивается.", "З глибокого присіду тяга однією рукою. Корпус не повертається.", "Depuis un squat profond, traction d'un seul bras. Buste sans rotation.", "Single-arm pull from a deep squat. Torso does not rotate."], ["Reverse plank chest pull to straps", "В обратной планке тяните грудь к стропам, лопатки сводятся.", "У зворотній планці тягніть груди до строп, лопатки зводяться.", "En planche inversée, tirez la poitrine vers les sangles, omoplates serrées.", "In a reverse plank, pull the chest toward the straps, squeezing the shoulder blades."], ["TRX pull with arms along the body", "Лицом к стропам, руки идут вдоль корпуса. Тяга задней части плеч и спины.", "Обличчям до строп, руки йдуть уздовж корпуса. Тяга задньої частини плечей і спини.", "Face aux sangles, bras le long du corps. Traction de l'arrière des épaules et du dos.", "Facing the straps, arms travel along the body. Pulls the rear shoulders and back."], ["Prone arm raise (90°)", "Лежа на животе, руки под 90 градусов, поднимайте их над полом. Лопатки сводятся.", "Лежачи на животі, руки під 90 градусів, піднімайте їх над підлогою. Лопатки зводяться.", "À plat ventre, bras à 90 degrés, levez-les au-dessus du sol. Omoplates serrées.", "Lying face down, arms at 90 degrees, lift them off the floor. Shoulder blades squeeze."], ["Prone thumbs-up raise", "Лежа на животе, прямые руки вверх большими пальцами к потолку. Пауза наверху.", "Лежачи на животі, прямі руки вгору великими пальцями до стелі. Пауза нагорі.", "À plat ventre, bras tendus levés pouces vers le plafond. Pause en haut.", "Lying face down, raise straight arms with thumbs up. Pause at the top."], ["Prone big arm circle", "Лежа на животе, руки на пояснице, рисуйте большой круг руками вперед и назад.", "Лежачи на животі, руки на попереку, малюйте велике коло руками вперед і назад.", "À plat ventre, mains sur le bas du dos, grands cercles des bras.", "Lying face down with hands at the lower back, draw big arm circles."], ["Prone scapular lift (hands behind head)", "Лежа на животе, руки за головой. Приподнимайте грудь, лопатки сводятся.", "Лежачи на животі, руки за головою. Приподнімайте груди, лопатки зводяться.", "À plat ventre, mains derrière la tête. Décollez la poitrine, omoplates serrées.", "Lying face down with hands behind the head. Lift the chest, squeezing the shoulder blades."], ["Prone scapular lift (hands on lower back)", "Лежа на животе, руки на пояснице. Приподнимайте грудь и лопатки, шея нейтральна.", "Лежачи на животі, руки на попереку. Приподнімайте груди й лопатки, шия нейтральна.", "À plat ventre, mains sur le bas du dos. Décollez poitrine et omoplates, nuque neutre.", "Lying face down with hands on the lower back. Lift the chest and shoulder blades, neck neutral."], ["TRX single-arm biceps curl", "Лицом к точке крепления, одна рука сгибается, локоть неподвижен.", "Обличчям до точки кріплення, одна рука згинається, лікоть нерухомий.", "Face à l'ancrage, un bras fléchit, coude fixe.", "Facing the anchor, one arm curls with the elbow fixed."], ["TRX kneeling biceps curl with lean", "На коленях, откинувшись назад, сгибайте руки к голове. Корпус не раскачивается.", "На колінах, відхилившись назад, згинайте руки до голови. Корпус не розгойдується.", "À genoux, penchée en arrière, fléchissez les bras vers la tête. Buste stable.", "Kneeling and leaning back, curl the hands toward the head. Torso stays still."], ["TRX triceps extension facing away", "Спиной к точке крепления, руки впереди. Разгибайте локти, наклоняясь вперед.", "Спиною до точки кріплення, руки попереду. Розгинайте лікті, нахиляючись уперед.", "Dos à l'ancrage, bras devant. Tendez les coudes en vous penchant vers l'avant.", "Back to the anchor, arms in front. Extend the elbows while leaning forward."], ["TRX kneeling triceps extension", "На коленях лицом к точке крепления. Разгибайте локти, предплечья вперед.", "На колінах обличчям до точки кріплення. Розгинайте лікті, передпліччя вперед.", "À genoux face à l'ancrage. Tendez les coudes, avant-bras vers l'avant.", "Kneeling facing the anchor. Extend the elbows, forearms forward."], ["TRX triceps push-out", "Кисти толкают тело вперед, локти идут вперед и разгибаются. Корпус прямой.", "Кисті штовхають тіло вперед, лікті йдуть уперед і розгинаються. Корпус прямий.", "Les mains poussent le corps vers l'avant, coudes qui se tendent. Buste droit.", "The hands push the body forward as the elbows extend. Torso straight."], ["Triceps press-out (straps under arms)", "Стропы под мышками, выжимайте тело вперед и вверх усилием трицепса.", "Стропи під пахвами, видавлюйте тіло вперед і вгору зусиллям трицепса.", "Sangles sous les aisselles, poussez le corps vers l'avant avec les triceps.", "Straps under the armpits, press the body forward and up with the triceps."], ["Diagonal crunch", "Лежа, тянитесь локтем к противоположному колену. Поясница на полу.", "Лежачи, тягніться ліктем до протилежного коліна. Поперек на підлозі.", "Allongée, ramenez le coude vers le genou opposé. Bas du dos au sol.", "Lying down, bring the elbow toward the opposite knee. Lower back on the floor."], ["Straight-leg hip raise", "Лежа, ноги вверх. Поднимайте таз к потолку усилием пресса, а не раскачкой.", "Лежачи, ноги вгору. Піднімайте таз до стелі зусиллям преса, а не розгойдуванням.", "Allongée, jambes en l'air. Montez le bassin vers le plafond avec les abdos, sans élan.", "Lying with legs up. Lift the hips toward the ceiling using the abs, not momentum."], ["Scissor kick", "Лежа, ноги над полом, поочередно скрещивайте их. Поясница прижата.", "Лежачи, ноги над підлогою, почергово схрещуйте їх. Поперек притиснутий.", "Allongée, jambes au-dessus du sol, croisez-les en alternance. Bas du dos plaqué.", "Lying with legs hovering, cross them alternately. Lower back pressed down."], ["Heel tap (legs at 90°)", "Ноги под 90 градусов. Поочередно опускайте пятку к полу, поясница прижата.", "Ноги під 90 градусів. Почергово опускайте п'яту до підлоги, поперек притиснутий.", "Jambes à 90 degrés. Touchez le sol du talon en alternance, bas du dos plaqué.", "Legs at 90 degrees. Alternately tap a heel to the floor with the lower back pressed down."], ["Bear hold", "На четвереньках, колени на 2 см над полом. Держите спину ровной.", "На четвереньках, коліна на 2 см над підлогою. Тримайте спину рівною.", "À quatre pattes, genoux à 2 cm du sol. Dos plat.", "On all fours with the knees hovering 2 cm above the floor. Keep the back flat."], ["Alternating ankle tap", "Лежа, колени согнуты, тянитесь рукой к щиколотке сбоку поочередно.", "Лежачи, коліна зігнуті, тягніться рукою до щиколотки збоку почергово.", "Allongée, genoux fléchis, touchez la cheville de chaque côté en alternance.", "Lying with knees bent, reach to each ankle in alternation."], ["Side plank hip dip", "В боковой планке опускайте бедро к полу и поднимайте обратно, не заваливая корпус.", "У боковій планці опускайте стегно до підлоги й піднімайте назад, не завалюючи корпус.", "En planche latérale, descendez la hanche vers le sol puis remontez, buste aligné.", "In a side plank, dip the hip toward the floor and lift back up with the torso aligned."], ["Plank knee-to-shoulder", "Из высокой планки подтягивайте колено к плечу поочередно, таз ровный.", "З високої планки підтягуйте коліно до плеча почергово, таз рівний.", "En planche haute, ramenez le genou vers l'épaule en alternance, bassin stable.", "From a high plank, bring each knee toward the same-side shoulder. Hips level."], ["Plank hand walk", "Из планки на предплечьях шагайте руками на прямые руки и обратно, таз ровный.", "З планки на передпліччях крокуйте руками на прямі руки й назад, таз рівний.", "Depuis la planche sur avant-bras, montez sur les mains puis redescendez, bassin stable.", "From a forearm plank walk up to straight arms and back down, hips steady."], ["High plank to pike", "Из высокой планки поднимайте таз вверх, затем возвращайтесь в планку. Ноги прямые.", "З високої планки піднімайте таз угору, потім повертайтеся в планку. Ноги прямі.", "En planche haute, montez le bassin en pique puis revenez. Jambes tendues.", "From a high plank, lift the hips into a pike then return. Legs stay straight."], ["Forearm-to-high plank transition", "Переход из планки на предплечьях на прямые руки и обратно, по очереди ведущая рука.", "Перехід із планки на передпліччях на прямі руки й назад, по черзі ведуча рука.", "Passage de la planche sur avant-bras à la planche haute et retour, bras de départ en alternance.", "Move from a forearm plank to a high plank and back, alternating the leading arm."], ["High plank with side leg lift", "Высокая планка, поочередно отводите прямую ногу в сторону. Таз не поворачивается.", "Висока планка, почергово відводьте пряму ногу вбік. Таз не повертається.", "Planche haute, écartez la jambe tendue sur le côté en alternance. Bassin sans rotation.", "High plank, alternately lift a straight leg out to the side. Hips don't rotate."], ["Plank hip dip", "В планке на предплечьях поворачивайте таз вправо и влево, касаясь бедром пола.", "У планці на передпліччях повертайте таз праворуч і ліворуч, торкаючись стегном підлоги.", "En planche sur avant-bras, tournez le bassin à droite et à gauche vers le sol.", "In a forearm plank rotate the hips side to side, dipping toward the floor."], ["Dead bug (both limbs)", "Лежа на спине, одновременно опускайте обе руки и обе ноги, поясница прижата.", "Лежачи на спині, одночасно опускайте обидві руки й обидві ноги, поперек притиснутий.", "Sur le dos, descendez ng jump lunge", "Из выпада выпрыгивайте вверх, меняя ноги в воздухе. Приземляйтесь мягко.", "З випаду вистрибуйте вгору, змінюючи ноги в повітрі. Приземляйтеся м'яко.", "Depuis la fente, sautez en changeant de jambe en l'air. Réception souple.", "From a lunge, jump and switch legs in the air. Land softly."], ["Jump squat with twist", "Прыжковый присед с поворотом корпуса в сторону в воздухе. Приземление мягкое.", "Стрибковий присід із поворотом корпуса вбік у повітрі. Приземлення м'яке.", "Squat sauté avec rotation du buste en l'air. Réception souple.", "Jump squat with a torso twist in the air. Soft landing."], ["Plank jack to downward dog", "Из планки прыжком разведите ноги в стороны, затем подбросьте таз вверх в позицию собаки.", "З планки стрибком розведіть ноги вбік, потім підкиньте таз угору в позицію собаки.", "Depuis la planche, sautez pieds écartés puis montez le bassin en chien tête en bas.", "From a plank jump the feet out, then lift the hips into downward dog."], ["TRX lean-forward run", "Стропы под мышками, наклон вперед. Бегите на месте в быстром темпе.", "Стропи під пахвами, нахил уперед. Біжіть на місці у швидкому темпі.", "Sangles sous les aisselles, penchée en avant. Courez sur place à rythme rapide.", "Straps under the armpits, lean forward. Run in place at a fast pace."], ["TRX lunge stretch", "Нога в петле, выпад вперед. Плавно растягивайте переднюю поверхность бедра.", "Нога в петлі, випад уперед. Плавно розтягуйте передню поверхню стегна.", "Pied dans la sangle, fente avant. Étirez doucement l'avant de la cuisse.", "Foot in the strap, lunge forward. Gently stretch the front of the thigh."]];

var LANG = 'ru';
function tr(key, vars) {
  var d = I18N[LANG] && I18N[LANG][key];
  if (d == null) d = I18N.ru[key];
  if (d == null) return key;
  if (vars) d = d.replace(/\{(\w+)\}/g, function (m, k) { return vars[k] != null ? vars[k] : ''; });
  return d;
}
function withLang(lang, fn) { var o = LANG; LANG = lang; try { return fn(); } finally { LANG = o; } }
function labelMap(prefix, keys) {
  var o = {};
  keys.forEach(function (k) { Object.defineProperty(o, k, { enumerable: true, get: function () { return tr(prefix + k); } }); });
  return o;
}

      '<div class="field"><label for="e-note">' + esc(tr('e.note')) + '</label><textarea id="e-note" data-bind="e-note" style="min-height:70px;font-family:inherit;font-size:16px">' + esc(d.note) + '</textarea></div>' +
      '<div class="row between"><div class="row"><button type="button" class="btn dark" data-act="saveex">' + esc(tr('btn.save')) + '</button><button type="button" class="btn" data-act="closemodal">' + esc(tr('btn.cancel')) + '</button></div>' +
      (S.edit.id ? '<button type="button" class="btn danger' + (S.armed === 'delex' ? ' armed' : '') + '" data-act="delex">' + esc(S.armed === 'delex' ? tr('btn.confirmdel') : tr('btn.delete')) + '</button>' : '') + '</div></div></div>';
  }
  return '';
}
function render() {
  var tabs = ['build', 'clients', 'base', 'backup'];
  var body = S.tab === 'build' ? buildView() : S.tab === 'clients' ? clientsView() : S.tab === 'base' ? baseView() : backupView();
  var sw = '<div class="langs" role="group" aria-label="' + esc(tr('lang.label')) + '">' + LANGS.map(function (l) { return '<button type="button" data-act="lang" data-k="' + l[0] + '" aria-pressed="' + (S.lang === l[0]) + '">' + l[1] + '</button>'; }).join('') + '</div>';
  $('#hero').innerHTML = '<div class="hero"><svg class="straps" viewBox="0 0 200 200" fill="none" stroke="#B49CDB" stroke-width="3" stroke-linecap="round"><path d="M20 0h160" stroke-width="5"/><path d="M70 0C70 70 52 110 46 150"/><path d="M130 0c0 70 18 110 24 150"/><rect x="34" y="150" width="24" height="38" rx="12" stroke="#F0820B" stroke-width="4"/><rect x="142" y="150" width="24" height="38" rx="12" stroke="#F0820B" stroke-width="4"/></svg>' +
    '<div class="wrap">' + sw + '<p class="mark">TRX Flow.Her</p><h1 class="brand">' + esc(tr('app.title')) + '</h1><p class="sub">' + esc(tr('app.sub')) + '</p>' +
    '<div class="legend">' + eqBadge('t') + eqBadge('d') + eqBadge('r') + eqBadge('b') + '</div></div></div>';
  var nav = '<nav class="tabs" role="tablist">' + tabs.map(function (t) { return '<button type="button" role="tab" data-act="tab" data-k="' + t + '" aria-selected="' + (S.tab === t) + '">' + esc(tr('tab.' + t)) + '</button>'; }).join('') + '</nav>';
  $('#app').innerHTML = nav + body;
  $('#modal').innerHTML = modalHtml();
  if (S.text) { var ta = $('#modal-text'); if (ta) { ta.focus(); ta.select(); } }
}

/* ---------- действия ---------- */
function arm(key, fn) {
  if (S.armed === key) { S.armed = ''; fn(); return; }
  S.armed = key; render();
  setTimeout(function () { if (S.armed === key) { S.armed = ''; render(); } }, 4000);
}
function toggle(arr, k) { var i = arr.indexOf(k); if (i >= 0) arr.splice(i, 1); else arr.push(k); }
function generate(seed, isRegen) {
  var f = JSON.parse(JSON.stringify(S.form));
  var keep = S.current && S.current.savedId;
  var base = S.history.slice();
  if (isRegen && S.lastLogged && base.length && base[base.length - 1].t === S.lastLogged) base.pop();
  var res = generateProgram(S.lib, f, seed || Date.now(), base);
  S.current = { name: f.name.trim(), form: f, sessions: res.sessions, warnings: res.warnings, savedId: keep ? S.current.savedId : null, createdAt: Date.now() };
  var he = historyEntry(S.current, f); S.history = base.concat([he]).slice(-30); S.lastLogged = he.t;
  S.armed = ''; persist(); render();
}
function openText(title, body) { S.text = { title: title, body: body }; render(); }
async function copyOrShow(title, text) {
  try { await navigator.clipboard.writeText(text); toast(tr('toast.copied')); }
  catch (e) { openText(title, text); }
}
function toast(msg) {
  var t = document.createElement('div'); t.textContent = msg; t.setAttribute('role', 'status');
  t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--primary);color:var(--on-primary);padding:10px 16px;border-radius:999px;font-weight:600;z-index:30';
  document.body.appendChild(t); setTimeout(function () { t.remove(); }, 1800);
}
async function saveFile(name, text, fallbackTitle) {
  try { await Store.dl.save({ filename: name, data: new Blob([text], { type: 'text/plain;charset=utf-8' }) }); }
  catch (e) { openText(fallbackTitle, text); }
}
function newDraft() { return { pro: '', how_ru: '', how_uk: '', how_fr: '', how_en: '', name: '', n_uk: '', n_fr: '', n_en: '', eq: [], pat: 'squat', lvl: 1, unit: 'r', contra: [], url: '', note: '' }; }

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]'); if (!el) return;
  var act = el.getAttribute('data-act'), k = el.getAttribute('data-k'), id = el.getAttribute('data-id');
  if (el.tagName === 'A') return;
  if (act === 'closemodal') { if (ev.target !== el && el.classList.contains('modal-bg')) return; S.text = null; S.edit = null; S.armed = ''; render(); return; }
  if (act === 'delprog') { ev.stopPropagation(); arm('del:' + id, function () { S.programs = S.programs.filter(function (p) { return p.id !== id; }); if (S.current && S.current.savedId === id) S.current.savedId = null; persist(); render(); }); return; }
  switch (act) {
    case 'tab': S.tab = k; S.armed = ''; render(); window.scrollTo(0, 0); break;
    case 'format': S.form.format = k; persist(); render(); break;
    case 'focus': S.form.focus = k; persist(); render(); break;
    case 'clearhist': arm('clearhist', function () { S.history = []; S.lastLogged = 0; persist(); render(); }); break;
    case 'rounds': S.form.rounds = parseInt(k, 10); persist(); render(); break;
    case 'variety': S.form.variety = parseInt(k, 10); persist(); render(); break;
    case 'lang': setLang(k); persist(); render(); break;
    case 'textlang': S.progLang = k; render(); break;
    case 'restyle': if (!restyle(S.lib, S.current.form, S.current, +el.dataset.si, +el.dataset.bi, Date.now())) toast(tr('toast.noalt')); persist(); render(); break;
    case 'level': S.form.level = parseInt(k, 10); persist(); render(); break;
    case 'days': S.form.days = parseInt(k, 10); persist(); render(); break;
    case 'minutes': S.form.minutes = parseInt(k, 10); persist(); render(); break;
    case 'equip': toggle(S.form.equip, k); persist(); render(); break;
    case 'restr': toggle(S.form.restr, k); persist(); render(); break;
    case 'pf': S.form.pf = !S.form.pf; persist(); render(); break;
    case 'generate': S.lastLogged = 0; generate(); setTimeout(function () { var c = document.querySelector('.card + .card'); if (c && c.scrollIntoView) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50); break;
    case 'regen': generate(0, true); break;
    case 'copy': copyOrShow(tr('modal.text'), programToText(S.current, S.lib, textLang())); break;
    case 'download': saveFile('programma-' + (S.current.name || 'trenirovok').replace(/[^\wа-яА-ЯёЁ-]+/g, '_') + '.txt', programToText(S.current, S.lib, textLang()), tr('modal.text')); break;
    case 'save':
      if (S.current.savedId) { S.programs = S.programs.map(function (p) { return p.id === S.current.savedId ? Object.assign({}, S.current, { id: p.id, createdAt: Date.now() }) : p; }); }
      else { var np = Object.assign({}, S.current, { id: uid(), createdAt: Date.now() }); S.current.savedId = np.id; S.programs.push(np); }
      persist(); render(); toast(tr('toast.saved')); break;
    case 'swap': var ok = swapItem(S.lib, S.current.form, S.current, +el.dataset.si, +el.dataset.bi, +el.dataset.ii, Date.now()); if (!ok) toast(tr('toast.noalt')); persist(); render(); break;
    case 'remove': S.current.sessions[+el.dataset.si].blocks[+el.dataset.bi].items.splice(+el.dataset.ii, 1); persist(); render(); break;
    case 'open': var pr = S.programs.filter(function (p) { return p.id === id; })[0]; if (pr) { S.current = JSON.parse(JSON.stringify(pr)); S.current.savedId = pr.id; S.form = Object.assign(S.form, JSON.parse(JSON.stringify(pr.form)), { name: pr.name || '' }); S.tab = 'build'; render(); window.scrollTo(0, 0); } break;
    case 'addex': S.edit = { id: null, draft: newDraft() }; render(); break;
    case 'editex': var ex = S.lib.filter(function (e) { return e.id === id; })[0]; if (ex) { var dr = JSON.parse(JSON.stringify(ex)); dr.pro = exPro(ex); LANGS.forEach(function (l) { dr['how_' + l[0]] = exHow(ex, l[0]); }); S.edit = { id: id, draft: dr }; render(); } break;
    case 'saveex':
      var d = S.edit.draft; if (!d.name.trim()) { toast(tr('toast.needname')); break; }
      d.name = d.name.trim();
      if (S.edit.id) { S.lib = S.lib.map(function (e) { return e.id === S.edit.id ? Object.assign({}, d, { id: e.id }) : e; }); }
      else { d.id = 'c' + Date.now().toString(36); S.lib.push(d); }
      S.edit = null; persist(); render(); break;
    case 'delex': arm('delex', function () { S.lib = S.lib.filter(function (e) { return e.id !== S.edit.id; }); S.edit = null; persist(); render(); }); break;
    case 'exportcopy': copyOrShow(tr('modal.backup'), serialize()); break;
    case 'exportdl': saveFile('konstruktor-kopiya.json', serialize(), tr('modal.backup')); break;
    case 'import': arm('import', function () {
      try { var raw = ($('#imp').value || '').trim(); if (!applyData(raw)) throw new Error('bad'); persist(); render(); toast(tr('toast.imported')); }
      catch (e) { render(); toast(tr('toast.badcode')); } }); break;
    case 'resetlib': arm('reset', function () { S.lib = defaultExercises(); persist(); render(); toast(tr('toast.reset')); }); break;
  }
});
document.addEventListener('input', function (ev) {
  var b = ev.target.getAttribute && ev.target.getAttribute('data-bind'); if (!b) return;
  var v = ev.target.value;
  if (b === 'name') { S.form.name = v; persist(); }
  else if (b === 'fq') { S.filter.q = v; $('#base-list').innerHTML = baseRows(); }
  else if (b === 'e-name') S.edit.draft.name = v;
  else if (b === 'e-pro') S.edit.draft.pro = v;
  else if (b === 'e-how') S.edit.draft['how_' + ev.target.getAttribute('data-k')] = v;
  else if (b === 'e-nuk') S.edit.draft.n_uk = v;
  else if (b === 'e-nfr') S.edit.draft.n_fr = v;
  else if (b === 'e-nen') S.edit.draft.n_en = v;
  else if (b === 'e-url') S.edit.draft.url = v.trim();
  else if (b === 'e-note') S.edit.draft.note = v;
});
document.addEventListener('change', function (ev) {
  var t = ev.target, b = t.getAttribute && t.getAttribute('data-bind'); if (!b) return;
  if (b === 'goal') { S.form.goal = t.value; persist(); }
  else if (b === 'fpat') { S.filter.pat = t.value; $('#base-list').innerHTML = baseRows(); }
  else if (b === 'fvid') { S.filter.vid = t.value; $('#base-list').innerHTML = baseRows(); }
  else if (b === 'e-pat') S.edit.draft.pat = t.value;
  else if (b === 'e-lvl') S.edit.draft.lvl = parseInt(t.value, 10);
  else if (b === 'e-unit') S.edit.draft.unit = t.value;
  else if (b === 'e-eq') toggle(S.edit.draft.eq, t.getAttribute('data-k'));
  else if (b === 'e-co') toggle(S.edit.draft.contra, t.getAttribute('data-k'));
});
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && (S.edit || S.text)) { S.edit = null; S.text = null; render(); } });

(function boot() {
  var l = loadLocal(); if (l) { try { applyData(l); } catch (e) {} }
  setLang(S.lang);
  render();
  initStore();
})();

</script>
</body>
</html>
